        <div className="sc-descriptor">
          <span className="sc-desc-label">Signature</span>
          <span className="sc-desc-arrow">→</span>
          <span><b>{s.signature}</b></span>
          <span className="sep">·</span>
          <span>evaluated across {s.lifts.length} downstream variants</span>
        </div>
      </div>
    </>
  );
}

function MacroTree() {
  const { idx } = React.useContext(StrategyCtx);
  const strat = STRATEGIES[idx] || STRATEGIES[0];
  const tree = treeForStrategy(strat.id);
  const [view, setView] = useSp("tree");
  const [expanded, setExpanded] = useSec({ root: true, soph: true, dens: true, depth: false });
  const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));
  const branches = tree.children;
  const rootX = 50, rootY = 12, bY = 44, leafY = 80;
  const bCount = branches.length;
  const positions = { root: { x: rootX, y: rootY } };
  branches.forEach((b, bi) => {
    const bx = ((bi + 0.5) / bCount) * 100;
    positions[b.id] = { x: bx, y: bY };
    if (expanded[b.id] && b.children) {
      b.children.forEach((c, ci) => {
        const spread = 18;
        const span = (b.children.length - 1) * spread;
        positions[c.id] = { x: bx - span/2 + ci * spread, y: leafY };
      });
    }
  });
  const edges = [];
  branches.forEach(b => {
    edges.push([positions.root, positions[b.id]]);
    if (expanded[b.id] && b.children) b.children.forEach(c => edges.push([positions[b.id], positions[c.id]]));
  });
  const renderNode = (n, pos) => {
    const canExpand = n.children && n.children.length > 0;
    const open = expanded[n.id];
    const isActiveLeaf = n.kind === "leaf" && n.id === tree.activeLeaf;
    return (
      <div key={n.id}
           className={"mot-node " + n.kind + (open && canExpand ? " expanded" : "") + (isActiveLeaf ? " active-leaf" : "")}
           style={{ left: pos.x + "%", top: pos.y + "%" }}
           onClick={() => canExpand && toggle(n.id)}>
        {isActiveLeaf && <div className="mot-active-tag">POWERED BY {strat.short}</div>}
        <div className="mot-node-kicker">
          <span>{n.kicker}</span>
          {canExpand && <span className="pill">{n.children.length}</span>}
        </div>
        <div className="mot-node-title">{n.title}</div>
        <div className="mot-node-stat">
          <span>{n.stat}</span>
          {n.delta && <span className={"delta" + (n.neg ? " neg" : "")}>{n.delta}</span>}
        </div>
        <div className="mot-progress"><div className="bar" style={{width: (n.progress*100).toFixed(0) + "%"}}/></div>
        {canExpand && <div className="mot-node-expand">{open ? "−" : "+"}</div>}
      </div>
    );
  };
  const wrapStyle = {
    ["--mot-accent"]: strat.accent,
    ["--mot-accent-soft"]: hexToRgba(strat.accent, 0.06),
    ["--mot-accent-glow"]: hexToRgba(strat.accent, 0.18),
  };
  return (
    <div className="mot-wrap" style={wrapStyle} data-strat={strat.id} key={strat.id}>
      <div className="mot-head">
        <div className="mot-title-col">
          <div className="mot-title">Macro Objective Tree</div>
          <div className="mot-sub">
            <span className="mot-sub-dot" style={{background: strat.accent}}/>
            Under <b>{strat.name}</b> · {tree.badge}
          </div>
        </div>
        <div className="mot-meta">
          <span>3 branches · 6 leaves · {Math.round(tree.progress*100)}% on track</span>
          <div className="mot-tabs">
            <button className={view==="tree"?"on":""}   onClick={()=>setView("tree")}>Tree</button>
            <button className={view==="list"?"on":""}   onClick={()=>setView("list")}>List</button>
            <button className={view==="sankey"?"on":""} onClick={()=>setView("sankey")}>Sankey</button>
          </div>
        </div>
      </div>
      {view === "tree" && (
        <div className="mot-tree">
          <svg className="mot-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden>
            <defs>
              <linearGradient id="mot-edge" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={strat.accent} stopOpacity="0.60"/>
                <stop offset="100%" stopColor={strat.accent} stopOpacity="0.28"/>
              </linearGradient>
            </defs>
            {edges.map(([a,b], i) => {
              const my = (a.y + b.y) / 2;
              const d = `M ${a.x} ${a.y+3} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y-3}`;
              return <path key={i} d={d} fill="none" stroke="url(#mot-edge)" strokeWidth="0.35" vectorEffect="non-scaling-stroke"/>;
            })}
          </svg>
          {renderNode(tree, positions.root)}
          {branches.map(b => renderNode(b, positions[b.id]))}
          {branches.flatMap(b => expanded[b.id] && b.children ? b.children.map(c => renderNode(c, positions[c.id])) : [])}
        </div>
      )}
      {view === "list"   && <MacroList   tree={tree} strat={strat} expanded={expanded} toggle={toggle}/>}
      {view === "sankey" && <MacroSankey tree={tree} strat={strat}/>}
    </div>
  );
}

function MacroList({ tree, strat, expanded, toggle }) {
  const rows = [];
  const rowFor = (n, cls) => {
    const canExpand = n.children && n.children.length > 0;
    const open = expanded[n.id];
    const isActiveLeaf = n.kind === "leaf" && n.id === tree.activeLeaf;
    return (
      <div key={n.id} className={"mol-row " + cls + (isActiveLeaf ? " active-leaf" : "")} onClick={() => canExpand && toggle(n.id)}>
        <div className={"mol-twist" + (canExpand ? (open ? " open" : "") : " none")}>▶</div>
        <div>
          <div className="mol-kicker">
            {n.kicker}
            {isActiveLeaf && <span className="mol-active"> · {strat.short}</span>}
          </div>
          <div className="mol-title">{n.title}</div>
        </div>
        <div className="mol-bar"><span className="fill" style={{width: (n.progress*100).toFixed(0)+"%"}}/></div>
        <div className="mol-stat">{n.stat}</div>
        <div className={"mol-delta" + (n.neg ? " neg" : "")}>{n.delta || ""}</div>
        <div className="mol-chev">
          {canExpand && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d={open ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"}/></svg>}
        </div>
      </div>
    );
  };
  rows.push(rowFor(tree, "root"));
  tree.children.forEach(b => {
    rows.push(rowFor(b, "branch"));
    if (expanded[b.id] && b.children) {
      b.children.forEach(c => rows.push(rowFor(c, "leaf")));
    }
  });
  return <div className="mot-list">{rows}</div>;
}

function MacroSankey({ tree, strat }) {
  // ViewBox in logical units; preserveAspectRatio="xMidYMid meet" keeps it stable.
  const W = 1200, H = 460;
  const LABEL_L = 170, LABEL_R = 200;
  const PAD_TOP = 18, PAD_BOT = 18;
  const usable = H - PAD_TOP - PAD_BOT;
  const colX = [LABEL_L, W/2 - 7, W - LABEL_R - 14];
  const nodeW = 14;

  const root = tree;
  const branches = root.children;
  const leaves = branches.flatMap(b => b.children.map(c => ({ ...c, parent: b.id })));

  const branchWeight = branches.map(b => b.progress);
  const branchWeightSum = branchWeight.reduce((a,b) => a+b, 0);
  const branchFrac = branchWeight.map(w => w / branchWeightSum);

  const rootH = usable;
  const rootY = PAD_TOP;

  const gap = 18;
  const branchTotalH = rootH - (branches.length - 1) * gap;
  const branchH = branchFrac.map(f => branchTotalH * f);
  const branchY = [];
  let by = rootY;
  branches.forEach((b, i) => { branchY.push(by); by += branchH[i] + gap; });

  const leafGap = 10;
  const leafPos = {};
  branches.forEach((b, bi) => {
    const totalW = b.children.reduce((a,c) => a+c.progress, 0) || 1;
    const availH = branchH[bi] - (b.children.length - 1) * leafGap;
    let ly = branchY[bi];
    b.children.forEach(c => {
      const lh = Math.max(availH * (c.progress / totalW), 22);
      leafPos[c.id] = { y: ly, h: lh };
      ly += lh + leafGap;
    });
  });

  const flowColors = ["#1a7aff", "#10b981", "#f5a623"];

  // Root → Branch flows
  const rootToBranch = branches.map((b, i) => {
    const x0 = colX[0] + nodeW;
    const x1 = colX[1];
    const rFrac = branchFrac[i];
    const rOffsetStart = branchFrac.slice(0, i).reduce((a,v) => a+v, 0);
    const ry0 = rootY + rOffsetStart * rootH;
    const ry1 = ry0 + rFrac * rootH;
    const by0 = branchY[i];
    const by1 = by0 + branchH[i];
    const xm = (x0 + x1) / 2;
    const d = `M ${x0} ${ry0} C ${xm} ${ry0}, ${xm} ${by0}, ${x1} ${by0}
               L ${x1} ${by1} C ${xm} ${by1}, ${xm} ${ry1}, ${x0} ${ry1} Z`;
    return { d, i, key: "rb-" + i };
  });

  const branchToLeaf = [];
  branches.forEach((b, bi) => {
    const x0 = colX[1] + nodeW;
    const x1 = colX[2];
    const totalW = b.children.reduce((a,c) => a+c.progress, 0) || 1;
    let offsetY = branchY[bi];
    b.children.forEach(c => {
      const frac = c.progress / totalW;
      const by0 = offsetY;
      const by1 = offsetY + frac * branchH[bi];
      offsetY = by1;
      const ly0 = leafPos[c.id].y;
      const ly1 = ly0 + leafPos[c.id].h;
      const xm = (x0 + x1) / 2;
      const d = `M ${x0} ${by0} C ${xm} ${by0}, ${xm} ${ly0}, ${x1} ${ly0}
                 L ${x1} ${ly1} C ${xm} ${ly1}, ${xm} ${by1}, ${x0} ${ly1 - (ly1-ly0)} Z`;
      const d2 = `M ${x0} ${by0} C ${xm} ${by0}, ${xm} ${ly0}, ${x1} ${ly0}
                  L ${x1} ${ly1} C ${xm} ${ly1}, ${xm} ${by1}, ${x0} ${by1} Z`;
      branchToLeaf.push({ d: d2, i: bi, key: "bl-" + c.id });
    });
  });

  return (
    <div className="mot-sankey">
      <div className="mos-cols">
        <div className="mos-col-head">Ultimate Goal</div>
        <div className="mos-col-head mid">Branches</div>
        <div className="mos-col-head end">Leaves</div>
      </div>
      <svg className="mos-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
        <defs>
          {flowColors.map((c, i) => (
            <linearGradient key={i} id={`mos-flow-${i}`} x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stopColor={c} stopOpacity="0.42"/>
              <stop offset="100%" stopColor={c} stopOpacity="0.18"/>
            </linearGradient>
          ))}
        </defs>

        {rootToBranch.map(f => (
          <path key={f.key} d={f.d} fill={`url(#mos-flow-${f.i})`} className="mos-flow"/>
        ))}
        {branchToLeaf.map(f => (
          <path key={f.key} d={f.d} fill={`url(#mos-flow-${f.i})`} className="mos-flow"/>
        ))}

        {/* Root node + label (left of node) */}
        <rect className="mos-node-rect" x={colX[0]} y={rootY} width={nodeW} height={rootH} rx="3" fill="#0a1020"/>
        <text x={colX[0] - 12} y={rootY + rootH/2 - 8} textAnchor="end" className="mos-label-group">Analysis ≥ 0.90</text>
        <text x={colX[0] - 12} y={rootY + rootH/2 + 8} textAnchor="end" className="mos-label-sub">ULT · 68% · 0.83 → 0.90</text>

        {/* Branch nodes + labels (above node, centered) */}
        {branches.map((b, i) => (
          <g key={b.id}>
            <rect className="mos-node-rect" x={colX[1]} y={branchY[i]} width={nodeW} height={branchH[i]} rx="3" fill={flowColors[i]}/>
            <text x={colX[1] + nodeW + 12} y={branchY[i] + branchH[i]/2 - 4} className="mos-label-group">{b.title}</text>
            <text x={colX[1] + nodeW + 12} y={branchY[i] + branchH[i]/2 + 12} className="mos-label-sub">{b.stat} · {(b.progress*100).toFixed(0)}%</text>
          </g>
        ))}

        {/* Leaf nodes + labels (right of node) */}
        {leaves.map(l => {
          const p = leafPos[l.id];
          return (
            <g key={l.id}>
              <rect className="mos-node-rect" x={colX[2]} y={p.y} width={nodeW} height={p.h} rx="3" fill="#8fa2c4"/>
              <text x={colX[2] + nodeW + 10} y={p.y + p.h/2 - 2} className="mos-label-group">{l.title}</text>
              <text x={colX[2] + nodeW + 10} y={p.y + p.h/2 + 13} className="mos-label-sub">{l.stat} {l.delta}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function Sparkline({ data, color }) {
  const W = 80, H = 20;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => [i / (data.length-1) * W, H - ((v-min)/range) * H]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return (
    <svg className="dpv-card-spark" viewBox={`0 0 ${W} ${H}`} width="100%" height="20">
      <path d={d} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="1.3" fill={color}/>
    </svg>
  );
}

function VariantCarousel({ variants, activeIdx, setActiveIdx }) {
  const n = variants.length;
  const active = variants[activeIdx];

  const cardStyle = (i) => {
    const rel = i - activeIdx;
    const abs = Math.abs(rel);
    // Off-axis cards get smaller translate + rotation
    const tx = rel * 210;
    const tz = abs === 0 ? 0 : -140 - (abs - 1) * 80;
    const ry = rel === 0 ? 0 : rel > 0 ? -22 : 22;
    const scale = 1;
    const opacity = abs === 0 ? 1 : abs === 1 ? 0.72 : abs === 2 ? 0.38 : 0;
    const filter = abs === 0 ? "none" : `saturate(${0.72 - abs * 0.15}) brightness(${0.95 - abs * 0.04}) blur(${abs === 1 ? 0.5 : abs * 1.2}px)`;
    const pointerEvents = abs <= 1 ? "auto" : "none";
    const zIndex = 10 - abs;
    return {
      transform: `translate3d(${tx}px, 0, ${tz}px) rotateY(${ry}deg) scale(${scale})`,
      opacity,
      filter,
      pointerEvents,
      zIndex,
      ["--card-accent"]: variants[i].accent,
      ["--card-glow"]: hexToRgba(variants[i].accent, 0.42),
    };
  };

  return (
    <>
      <style dangerouslySetInnerHTML={{ __html: DPV_CAROUSEL_CSS }}/>
      <div className="vc-wrap">
        <div className="vc-head">
          <div className="vc-title-col">
            <div className="vc-kicker">Decomposed Prompt · variants</div>
            <div className="vc-title">Browse production variants</div>
            <div className="vc-sub">Same decomposition skeleton, specialized per downstream application</div>
          </div>
          <div className="vc-counter">
            <div className="vc-counter-num"><span className="cur">{String(activeIdx + 1).padStart(2, "0")}</span><span className="sep">/</span>{String(n).padStart(2, "0")}</div>
            <div className="vc-counter-bar"><div className="fill" style={{ width: ((activeIdx + 1) / n * 100) + "%" }}/></div>
          </div>
        </div>

        <div className="vc-arm">
          {variants.map((v, i) => (
            <button
              key={v.id}
              className={"vc-arm-chip" + (i === activeIdx ? " active" : "")}
              style={{
                ["--chip-accent"]: v.accent,
                ["--chip-accent-shadow"]: hexToRgba(v.accent, 0.4),
                color: i === activeIdx ? "#fff" : v.accent,
              }}
              onClick={() => setActiveIdx(i)}
            >
              <span className="dot"/>
              {v.app}
            </button>
          ))}
        </div>

        <div className="vc-stage">
          <div className="vc-stage-glow" style={{ ["--stage-glow"]: hexToRgba(active.accent, 0.18) }}/>
          <button className="vc-nav prev" onClick={() => setActiveIdx((activeIdx - 1 + n) % n)} aria-label="Previous variant">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M7.5 2.5 4 6 l3.5 3.5" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <button className="vc-nav next" onClick={() => setActiveIdx((activeIdx + 1) % n)} aria-label="Next variant">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M4.5 2.5 8 6 l-3.5 3.5" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <div className="vc-stage-inner">
            {variants.map((v, i) => {
              const isActive = i === activeIdx;
              const maxLift = Math.max(...v.slots.map(s => s.lift));
              return (
                <div
                  key={v.id}
                  className={"vc-card" + (isActive ? " active" : "")}
                  style={cardStyle(i)}
                  onClick={() => !isActive && setActiveIdx(i)}
                >
                  <div className="vc-card-head">
                    <div className="vc-card-id-col">
                      <div className="vc-card-id">{v.id} · {v.app}</div>
                      <div className="vc-card-app">{v.app}</div>
                    </div>
                    <div className={"vc-card-status " + v.status}>{v.status}</div>
                  </div>
                  <div className="vc-card-summary">{v.summary}</div>
                  <div className="vc-card-fingerprint">
                    {v.slots.map(s => (
                      <div key={s.id} className="vc-fp-item" title={`${s.label} · lift +${s.lift.toFixed(2)}`}>
                        <span className="vc-fp-dot" style={{ background: s.color }}/>
                        <div className="vc-fp-bar"><div className="f" style={{ width: (s.lift / maxLift * 100) + "%", background: s.color }}/></div>
                      </div>
                    ))}
                  </div>
                  <div className="vc-card-meta">
                    <div className="vc-card-stat"><span className="l">QUAL</span><span className="v">{v.quality.toFixed(2)}</span></div>
                    <div className="vc-card-stat"><span className="l">LIFT</span><span className="v lift">+{v.lift.toFixed(2)}</span></div>
                    <div className="vc-card-stat"><span className="l">TOK</span><span className="v">{v.tokens}</span></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="vc-descriptor" style={{ ["--desc-accent"]: active.accent }}>
          <span className="vc-desc-arrow">↳</span>
          <span className="vc-desc-label">Applied downstream</span>
          <b>{active.app}</b>
          <span className="sep">·</span>
          <span>{active.usage}</span>
          <span className="sep">·</span>
          <span><b>{active.signature}</b></span>
        </div>
      </div>
    </>
  );
}

function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function DecomposedPromptViz() {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const [open, setOpen] = React.useState(() => new Set(["constraints"]));
  const toggle = (id) => setOpen(s => {
    const n = new Set(s);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });

  const variant = DPV_VARIANTS[activeIdx];
  const slots = variant.slots;
  const pt = variant.promptTokens;
  const totalTokens = slots.reduce((s, x) => s + x.tokens, 0);
  const maxLift = Math.max(...slots.map(x => x.lift));

  return (
    <div className="dpv-wrap">
      <VariantCarousel variants={DPV_VARIANTS} activeIdx={activeIdx} setActiveIdx={setActiveIdx}/>

      <div className="dpv-head" style={{ paddingTop: 18 }}>
        <div className="dpv-title-col">
          <div className="dpv-title">Decomposed slots · {variant.id}</div>
          <div className="dpv-sub">5 slots · {totalTokens} tokens · tuned for {variant.app}</div>
        </div>
        <div className="dpv-versions">
          {["v1","v2","v3a","v3b","v4","v4.2"].map(v => (
            <button key={v} className={"dpv-ver" + (v === "v4.2" ? " current" : "")}>{v}</button>
          ))}
        </div>
      </div>

      <div className="dpv-prompt">
        <span className="token t-role" title="Role slot">You are {pt.role}</span>
        {" "}that must{" "}
        <span className="token t-task" title="Task slot">{pt.task}</span>.
        {" "}Given{" "}
        <span className="token t-context" title="Context slot">{pt.context}</span>,{" "}
        produce an output respecting{" "}
        <span className="token t-constraint" title="Constraints slot">{pt.constraint}</span>.
        {" "}Score yourself on{" "}
        <span className="token t-rubric" title="Rubric slot">{pt.rubric}</span>.
      </div>

      <div className="dpv-slots">
        {slots.map(s => {
          const isOpen = open.has(s.id);
          const liftPct = (s.lift / maxLift) * 100;
          const tokPct = (s.tokens / totalTokens) * 100;
          return (
            <div
              key={s.id}
              className={"dpv-slot" + (isOpen ? " open" : "") + (s.active ? " active" : "")}
              onClick={() => toggle(s.id)}
              role="button"
              tabIndex={0}
            >
              <div className="dpv-slot-row">
                <span className="dpv-slot-dot" style={{ background: s.color }}/>
                <div className="dpv-slot-label">
                  <span className="dpv-slot-name">{s.label}</span>
                  <span className="dpv-slot-count">×{s.count}</span>
                </div>
                <div className="dpv-slot-preview">{s.preview}</div>
                <div className="dpv-slot-inline">
                  <span className="dpv-inline-stat"><b>{s.tokens}</b> tok</span>
                  <span className="dpv-inline-stat"><b className="lift">+{s.lift.toFixed(2)}</b> lift</span>
                  <span className={"dpv-heat " + s.heat}>{s.heat}</span>
                </div>
                <svg className="dpv-slot-chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden>
                  <path d="M3 4.5 L6 7.5 L9 4.5" stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>

              {isOpen && (
                <div className="dpv-slot-detail" onClick={(e) => e.stopPropagation()}>
                  <div className="dpv-detail-text">
                    <div className="dpv-detail-kicker">Slot body</div>
                    {s.full}
                  </div>
                  <div className="dpv-detail-grid">
                    <div className="dpv-stat">
                      <div className="dpv-stat-label">Quality</div>
                      <div className="dpv-stat-value">{s.score.toFixed(2)}</div>
                      <Sparkline data={s.spark} color={s.color}/>
                    </div>
                    <div className="dpv-stat">
                      <div className="dpv-stat-label">Tokens</div>
                      <div className="dpv-stat-value">{s.tokens}<span className="dpv-stat-sub"> / {totalTokens}</span></div>
                      <div className="dpv-mini-bar"><div className="f" style={{ width: tokPct + "%", background: s.color }}/></div>
                    </div>
                    <div className="dpv-stat">
                      <div className="dpv-stat-label">Lift</div>
                      <div className="dpv-stat-value">+{s.lift.toFixed(2)}</div>
                      <div className="dpv-mini-bar"><div className="f" style={{ width: liftPct + "%", background: s.color }}/></div>
                    </div>
                    <div className="dpv-stat">
                      <div className="dpv-stat-label">Edits</div>
                      <div className="dpv-stat-value">{s.iterations}</div>
                      <div className="dpv-stat-sub-row">
                        {s.iterations === 0 ? "never edited" : `last ${s.iterations === 7 ? "2h ago" : "1d ago"}`}
                      </div>
                    </div>
                  </div>
                  <div className="dpv-detail-actions">
                    {s.proposals > 0 ? (
                      <button className="dpv-action primary">
                        <span className="dpv-badge">{s.proposals}</span>
                        Review pending proposal{s.proposals === 1 ? "" : "s"}
                        <svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 6h6M6.5 3.5 9 6 6.5 8.5" stroke="currentColor" strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </button>
                    ) : (
                      <span className="dpv-action-note">No pending proposals</span>
                    )}
                    <button className="dpv-action">Open in editor</button>
                    <button className="dpv-action">History</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}

/* ═══════════════════════════════════════════════════════════════
   FLOATING TOC — right-side index, glass aesthetic
   Uses scroll listener to track active section. Click → smooth
   scroll the .main scroller to the target element.
   ═══════════════════════════════════════════════════════════════ */
function FloatingTOC() {
  const items = [
    { id: "overview",   label: "Overview",               n: "" ,  depth: 0, sel: ".hero" },
    { id: "direct",     label: "Direct Experimentation", n: "",   depth: 0, sel: ".panels" },
    { id: "checkin",    label: "Check-in Updates",       n: "",   depth: 1, sel: ".panels > .panel:nth-child(1)" },
    { id: "twin",       label: "Digital Twin",           n: "",   depth: 1, sel: ".panels > .panel:nth-child(2)" },
    { id: "perf",       label: "Performance",            n: "",   depth: 1, sel: ".panels > .panel:nth-child(3)" },
    { id: "s01",        label: "Chain Discoveries",      n: "01", depth: 0, sel: null, match: (el) => el.classList?.contains("folder-shell") && /chain discoveries/i.test(el.textContent?.slice(0,120) || "") },
    { id: "s02",        label: "Downstream Reality",     n: "02", depth: 0, sel: null, match: (el) => el.classList?.contains("folder-shell") && /downstream reality/i.test(el.textContent?.slice(0,120) || "") },
    { id: "s03",        label: "Process Experimentation",n: "03", depth: 0, sel: null, match: (el) => el.classList?.contains("folder-shell") && /process experimentation/i.test(el.textContent?.slice(0,120) || "") },
    { id: "mot",        label: "Objective Tree",         n: "",   depth: 1, sel: ".mot-wrap" },
    { id: "dpv",        label: "Decomposed Prompt",      n: "",   depth: 1, sel: ".dpv-wrap" },
  ];

  const [active, setActive] = React.useState("overview");
  const [collapsed, setCollapsed] = React.useState(() => {
    try { return localStorage.getItem("vp_ftoc_collapsed") === "1"; } catch { return false; }
  });
  const scrollerRef = React.useRef(null);
  const targetsRef = React.useRef({}); // id → DOM element

  // Persist
  React.useEffect(() => {
    try { localStorage.setItem("vp_ftoc_collapsed", collapsed ? "1" : "0"); } catch {}
  }, [collapsed]);

  // Reflect collapsed state on <body> so .main can reserve/release right padding
  React.useEffect(() => {
    document.body.classList.toggle("ftoc-collapsed", collapsed);
    return () => document.body.classList.remove("ftoc-collapsed");
  }, [collapsed]);

  // Resolve each item to a DOM element
  React.useEffect(() => {
    const scroller = document.querySelector(".main");
    scrollerRef.current = scroller;
    if (!scroller) return;
    const map = {};
    for (const it of items) {
      if (it.sel) {
        map[it.id] = document.querySelector(it.sel);
      } else if (it.match) {
        const all = document.querySelectorAll(".folder-shell");
        for (const el of all) {
          if (it.match(el)) { map[it.id] = el; break; }
        }
      }
    }
    targetsRef.current = map;
  }, []);

  // Track active section on scroll
  React.useEffect(() => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    const onScroll = () => {
      const tops = [];
      for (const it of items) {
        const el = targetsRef.current[it.id];
        if (!el) continue;
        const elTop = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
        tops.push({ id: it.id, top: elTop });
      }
      // active = last item whose top is <= 100px from viewport top
      let current = items[0].id;
      for (const t of tops) {
        if (t.top <= 120) current = t.id;
      }
      setActive(current);
    };
    onScroll();
    scroller.addEventListener("scroll", onScroll, { passive: true });
    return () => scroller.removeEventListener("scroll", onScroll);
  }, []);

  const scrollTo = (id) => {
    const scroller = scrollerRef.current;
    const el = targetsRef.current[id];
    if (!scroller || !el) return;
    const top = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - 20;
    scroller.scrollTo({ top, behavior: "smooth" });
  };

  return (
    <aside className={"ftoc" + (collapsed ? " collapsed" : "")}>
      <div className="ftoc-head">
        <div className="ftoc-kicker">
          <span className="ftoc-dot"/>
          <span>INDEX</span>
        </div>
        <button
          className="ftoc-collapse"
          onClick={() => setCollapsed(c => !c)}
          aria-label={collapsed ? "Expand index" : "Collapse index"}
          title={collapsed ? "Expand" : "Collapse"}
        >
          <svg viewBox="0 0 12 12" width="10" height="10">
            <path d={collapsed ? "M4 2 L8 6 L4 10" : "M8 2 L4 6 L8 10"} stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>
      <nav className="ftoc-nav">
        {items.map(it => (
          <button
            key={it.id}
            className={"ftoc-item depth-" + it.depth + (active === it.id ? " active" : "")}
            onClick={() => scrollTo(it.id)}
            title={it.label}
          >
            <span className="ftoc-bar"/>
            {it.n && <span className="ftoc-num">{it.n}</span>}
            {!it.n && it.depth === 1 && <span className="ftoc-tick"/>}
            <span className="ftoc-label">{it.label}</span>
          </button>
        ))}
      </nav>
    </aside>
  );
}

<script>
(function(){
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "phaseTitle": "Phase Diagram — Prompt Optimization Landscape",
    "phaseAxisX": "EXPLORATION  (temperature · sampling breadth)",
    "phaseAxisY": "SPECIFICITY  (constraints)",
    "phaseOptimal": "Optimal regime",
    "phaseHot": "Under-constrained",
    "phaseCold": "Over-constrained"
  }/*EDITMODE-END*/;

  function applyCfg(v) {
    window.PHASE_CFG = {
      title: v.phaseTitle,
      axes: { x: v.phaseAxisX, y: v.phaseAxisY },
      regime: { optimal: v.phaseOptimal, hot: v.phaseHot, cold: v.phaseCold }
    };
    if (window.__phaseRerender) window.__phaseRerender();
  }
  let state = {...TWEAK_DEFAULTS};
  applyCfg(state);

  function mount() {
    if (document.getElementById('tweaks-panel')) return;
    const css = document.createElement('style');
    css.textContent = `
      #tweaks-panel { position: fixed; right: 18px; bottom: 18px; z-index: 9999;
        background: rgba(255,255,255,0.94);
        backdrop-filter: saturate(1.5) blur(18px); -webkit-backdrop-filter: saturate(1.5) blur(18px);
        border: 1px solid rgba(80,100,140,0.18);
        box-shadow: 0 24px 56px -20px rgba(30,50,100,0.4), 0 1px 0 rgba(255,255,255,0.95) inset;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        color: #1a2844; display: none;
        border-radius: 14px;
        transition: width .3s cubic-bezier(.2,.8,.2,1), border-radius .3s;
      }
      #tweaks-panel.open { display: block; animation: tpIn .25s cubic-bezier(.2,.8,.2,1); }
      #tweaks-panel.collapsed { width: auto; }
      #tweaks-panel.expanded  { width: 310px; border-radius: 18px; }
      @keyframes tpIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

      #tweaks-panel .tp-head {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px; cursor: pointer;
        user-select: none;
        border-radius: inherit;
      }
      #tweaks-panel .tp-head:hover { background: rgba(106,140,255,0.06); }
      #tweaks-panel .tp-head .dot { width: 7px; height: 7px; border-radius: 50%;
        background: #6a8cff; box-shadow: 0 0 10px rgba(106,140,255,0.9);
        animation: tpPulse 2s ease-in-out infinite; flex-shrink: 0; }
      @keyframes tpPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
      #tweaks-panel .tp-head .tp-title { font-size: 10.5px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase; color: #4a5b7c;
        white-space: nowrap; }
      #tweaks-panel .tp-head .tp-chev { margin-left: auto; color: #8a96b0;
        transition: transform .3s; flex-shrink: 0; }
      #tweaks-panel.expanded .tp-chev { transform: rotate(180deg); }

      #tweaks-panel .tp-body {
        overflow: hidden; max-height: 0; opacity: 0;
        transition: max-height .35s cubic-bezier(.2,.8,.2,1), opacity .25s, padding .3s;
        padding: 0 16px;
      }
      #tweaks-panel.expanded .tp-body { max-height: 520px; opacity: 1; padding: 2px 16px 16px; }

      #tweaks-panel label { display: block; font-size: 9.5px; font-weight: 600;
        color: #6a7690; letter-spacing: 0.06em; margin: 11px 0 4px; text-transform: uppercase; }
      #tweaks-panel input { width: 100%; font-size: 12px; padding: 7px 9px;
        border: 1px solid rgba(80,100,140,0.2); border-radius: 9px;
        background: rgba(255,255,255,0.75); color: #1a2844; font-family: inherit;
        transition: border-color .2s, box-shadow .2s; box-sizing: border-box;
      }
      #tweaks-panel input:focus { outline: none; border-color: #6a8cff;
        box-shadow: 0 0 0 3px rgba(106,140,255,0.18); background: #fff; }
      #tweaks-panel .preset { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
      #tweaks-panel .preset button { font-size: 10.5px; padding: 6px 10px; border-radius: 8px;
        border: 1px solid rgba(80,100,140,0.2); background: rgba(255,255,255,0.7);
        color: #3a4a6e; cursor: pointer; font-family: inherit; font-weight: 500;
        transition: border-color .2s, background .2s, color .2s; }
      #tweaks-panel .preset button:hover { border-color: #6a8cff; color: #2a3d8a;
        background: rgba(106,140,255,0.1); }
    `;
    document.head.appendChild(css);

    const p = document.createElement('div');
    p.id = 'tweaks-panel';
    p.innerHTML = `
      <div class="tp-head">
        <span class="dot"></span>
        <span class="tp-title">Tweaks · Phase Diagram</span>
        <svg class="tp-chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="tp-body">
        <label>Title</label><input data-k="phaseTitle"/>
        <label>X Axis</label><input data-k="phaseAxisX"/>
        <label>Y Axis</label><input data-k="phaseAxisY"/>
        <label>Optimal Regime</label><input data-k="phaseOptimal"/>
        <label>Hot Zone · top-left</label><input data-k="phaseHot"/>
        <label>Cold Zone · bottom-right</label><input data-k="phaseCold"/>
        <div class="preset">
          <button data-preset="prompt">Prompt Optimization</button>
          <button data-preset="product">Product Discovery</button>
          <button data-preset="research">Research Triage</button>
        </div>
      </div>
    `;
    p.classList.add('collapsed');
    p.querySelector('.tp-head').addEventListener('click', () => {
      p.classList.toggle('collapsed');
      p.classList.toggle('expanded');
    });
    document.body.appendChild(p);

    const presets = {
      prompt:  {phaseTitle:"Phase Diagram — Prompt Optimization Landscape", phaseAxisX:"EXPLORATION  (temperature · sampling breadth)", phaseAxisY:"SPECIFICITY  (constraints)", phaseOptimal:"Optimal regime", phaseHot:"Under-constrained", phaseCold:"Over-constrained"},
      product: {phaseTitle:"Phase Diagram — Product Discovery Landscape",  phaseAxisX:"NOVELTY  (breadth of hypotheses)",              phaseAxisY:"EVIDENCE  (signal strength)",  phaseOptimal:"Product-market fit", phaseHot:"Unvalidated",     phaseCold:"Over-fitted"},
      research:{phaseTitle:"Phase Diagram — Research Triage Landscape",    phaseAxisX:"EXPLORATION  (topic breadth)",                  phaseAxisY:"DEPTH  (source rigor)",         phaseOptimal:"Insight regime",    phaseHot:"Shallow",         phaseCold:"Over-narrow"},
    };

    const inputs = p.querySelectorAll('input');
    function sync() { inputs.forEach(i => i.value = state[i.dataset.k] || ''); }
    sync();
    inputs.forEach(i => i.addEventListener('input', e => {
      state[i.dataset.k] = e.target.value;
      applyCfg(state);
      try { window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[i.dataset.k]: e.target.value}}, '*'); } catch(e){}
    }));
    p.querySelectorAll('button[data-preset]').forEach(b => b.addEventListener('click', () => {
      state = {...presets[b.dataset.preset]};
      applyCfg(state);
      sync();
      try { window.parent.postMessage({type: '__edit_mode_set_keys', edits: state}, '*'); } catch(e){}
    }));
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') { mount(); document.getElementById('tweaks-panel').classList.add('open'); }
    else if (d.type === '__deactivate_edit_mode') { const el = document.getElementById('tweaks-panel'); if (el) el.classList.remove('open'); }
  });
  try { window.parent.postMessage({type: '__edit_mode_available'}, '*'); } catch(e){}
})();
</script>

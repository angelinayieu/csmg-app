}
.sn-close:hover { background: rgba(15,23,42,0.08); color: var(--fg); }

/* ═══════════════════════════════════════════════════════════════
   SECTION DIVIDER — Direct / Process Experimentation
   ═══════════════════════════════════════════════════════════════ */
.section-divider {

  margin: 28px 0 10px;
  padding: 0 2px;
}
.section-divider .sd-num {

  border-radius: 999px;

}
.section-divider .sd-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.section-divider .sd-sub {
  font-size: 12px;

}
.section-divider .sd-line {

/* ═══════════════════════════════════════════════════════════════
   MACRO OBJECTIVE TREE
   ═══════════════════════════════════════════════════════════════ */
.mot-wrap {
  padding: 22px 26px 26px;
  border-radius: 24px;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--mot-accent-soft, rgba(26,122,255,0.06)) 0%, transparent 50%),
    linear-gradient(180deg, rgba(255,255,255,0.92), rgba(250,252,255,0.72));
  border: 1px solid rgba(255,255,255,0.95);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.98) inset,
    0 0 0 1px rgba(255,255,255,0.5) inset,
    0 12px 28px -14px rgba(15,23,42,0.2),
    0 4px 10px -6px rgba(15,23,42,0.14);
  backdrop-filter: blur(30px) saturate(1.7);
  -webkit-backdrop-filter: blur(30px) saturate(1.7);
  position: relative;
  z-index: 20;
  overflow: hidden;
  margin: 10px 22px 22px;
  transform: translateY(0);
  transition:
    box-shadow .6s cubic-bezier(.22,1,.36,1),
    background .6s ease,
    border-color .4s ease;
  animation: mot-float-in .6s cubic-bezier(.22,1,.36,1);
}
.mot-wrap::before {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -20%, rgba(255,255,255,0.55), transparent 55%);
  border-radius: inherit;
  opacity: 0.8;
}
@keyframes mot-float-in {
  0%   { transform: translateY(14px) scale(0.985); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
/* Subtle spring-rebind when strategy changes */
.mot-wrap[data-strat] {
  animation: mot-rebind .55s cubic-bezier(.22,1.35,.36,1);
}
@keyframes mot-rebind {
  0%   { transform: translateY(6px) scale(0.992); filter: saturate(0.7); }
  55%  { transform: translateY(-2px) scale(1.004); filter: saturate(1.15); }
  100% { transform: translateY(0) scale(1); filter: saturate(1); }
}
.mot-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.mot-head .mot-title {
  font-size: 13.5px; font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.015em;
  padding-left: 10px;
  position: relative;
}
.mot-head .mot-title::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 14px; border-radius: 2px;
  background: linear-gradient(180deg, #1a7aff, #65d4e8);
}
.mot-meta {
  display: flex; align-items: center; gap: 10px;
  font-family: 'JetBrains Mono';
  font-size: 10px; font-weight: 600;
  color: var(--fg-mute);
  letter-spacing: 0.06em;
}
.mot-tabs {
  display: inline-flex; padding: 2px; gap: 2px;
  border-radius: 999px;
  background: rgba(15,23,42,0.05);
  border: 1px solid rgba(120,140,180,0.18);
}
.mot-tabs button {
  border: none; background: transparent;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 10.5px; font-weight: 600;
  color: var(--fg-mute);
  cursor: pointer;
  font-family: inherit;
}
.mot-tabs button.on {
  background: white;
  color: var(--fg);
  box-shadow: 0 2px 5px -2px rgba(15,23,42,0.15);
}

/* Tree layout */
.mot-tree { position: relative; min-height: 400px; }
.mot-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.mot-node {
  position: absolute;
  transform: translate(-50%, -50%);
  min-width: 140px;
  max-width: 220px;
  padding: 10px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(252,253,255,0.82));
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.98) inset,
    0 0 0 1px rgba(255,255,255,0.4) inset,
    0 10px 22px -10px rgba(15,23,42,0.22),
    0 2px 6px -3px rgba(15,23,42,0.12);
  backdrop-filter: blur(14px) saturate(1.5);
  -webkit-backdrop-filter: blur(14px) saturate(1.5);
  cursor: pointer;
  transition:
    transform 0.4s cubic-bezier(.22,1.35,.36,1),
    box-shadow 0.3s,
    border-color 0.3s;
  z-index: 2;
  animation: mot-node-in .55s cubic-bezier(.22,1.35,.36,1) both;
}
@keyframes mot-node-in {
  0%   { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
  60%  { opacity: 1; transform: translate(-50%, -52%) scale(1.015); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.mot-wrap[data-strat] .mot-node { animation-duration: .5s; }
.mot-node:nth-child(2) { animation-delay: .02s; }
.mot-node:nth-child(3) { animation-delay: .05s; }
.mot-node:nth-child(4) { animation-delay: .08s; }
.mot-node:nth-child(5) { animation-delay: .11s; }
.mot-node:nth-child(6) { animation-delay: .14s; }
.mot-node:nth-child(7) { animation-delay: .17s; }
.mot-node:nth-child(8) { animation-delay: .20s; }
.mot-node:nth-child(9) { animation-delay: .23s; }
.mot-node:hover {
  transform: translate(-50%, -50%) translateY(-3px) scale(1.015);
  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 16px 30px -10px var(--mot-accent-glow, rgba(26,122,255,0.35)),
    0 0 0 1.5px var(--mot-accent, rgba(26,122,255,0.4));
}
.mot-node.root {
  background: linear-gradient(180deg, rgba(26,122,255,0.95), rgba(10,106,238,0.95));
  color: white;
  border-color: rgba(255,255,255,0.5);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 10px 24px -6px rgba(26,122,255,0.45);
  min-width: 180px;
}
.mot-node.root .mot-node-kicker { color: rgba(255,255,255,0.75); }
.mot-node.root .mot-node-title  { color: white; }
.mot-node.root .mot-node-stat   { color: rgba(255,255,255,0.9); }
.mot-node.leaf {
  min-width: 130px;
  max-width: 180px;
  padding: 8px 12px;
}
.mot-node-kicker {
  font-family: 'JetBrains Mono';
  font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-transform: uppercase;
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px;
}
.mot-node-kicker .pill {
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(26,122,255,0.12);
  color: rgb(var(--accent-rgb));
  font-size: 8px;
  letter-spacing: 0.1em;
}
.mot-node.root .mot-node-kicker .pill {
  background: rgba(255,255,255,0.22);
  color: white;
}
.mot-node-title {
  font-size: 12px; font-weight: 700;
  color: var(--fg);
  line-height: 1.25;
  letter-spacing: -0.01em;
}
.mot-node.leaf .mot-node-title {
  font-size: 11.5px;
  font-weight: 600;
}
.mot-node-stat {
  font-family: 'JetBrains Mono';
  font-size: 10px; font-weight: 700;
  color: var(--fg-soft);
  margin-top: 4px;
  display: flex; align-items: center; gap: 8px;
}
.mot-node-stat .delta { color: #10b981; }
.mot-node-stat .delta.neg { color: #ef4444; }
.mot-node-expand {
  position: absolute;
  right: -8px; top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: white;
  border: 1px solid rgba(120,140,180,0.3);
  color: var(--fg-mute);
  box-shadow: 0 2px 4px rgba(15,23,42,0.1);
  font-size: 11px; font-weight: 700;
  z-index: 3;
}
.mot-node.expanded .mot-node-expand { background: rgb(var(--accent-rgb)); color: white; border-color: rgb(var(--accent-rgb)); }

/* ── Strategy-accent theming (driven by vars set on .mot-wrap) ───── */
.mot-wrap .mot-head .mot-title-col { display: flex; flex-direction: column; gap: 3px; }
.mot-wrap .mot-head .mot-title::before {
  background: linear-gradient(180deg, var(--mot-accent, #1a7aff), var(--mot-accent, #65d4e8));
}
.mot-wrap .mot-sub {
  font-family: 'JetBrains Mono';
  font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--fg-mute);
  display: inline-flex; align-items: center; gap: 6px;
  padding-left: 10px;
  text-transform: uppercase;
}
.mot-wrap .mot-sub b {
  color: var(--fg); font-weight: 700;
  font-family: inherit;
}
.mot-wrap .mot-sub-dot {
  width: 7px; height: 7px; border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 0 10px var(--mot-accent-glow);
}
/* Root node takes the strategy accent */
.mot-wrap .mot-node.root {
  background: linear-gradient(180deg, var(--mot-accent, #1a7aff) 0%, color-mix(in srgb, var(--mot-accent, #1a7aff) 82%, #000 18%) 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 10px 24px -6px var(--mot-accent-glow, rgba(26,122,255,0.45));
}
/* Progress bar gradient + branch pill use accent */
.mot-wrap .mot-node:not(.root) .mot-progress .bar {
  background: linear-gradient(90deg, var(--mot-accent, #1a7aff), color-mix(in srgb, var(--mot-accent, #1a7aff) 40%, #65d4e8 60%));
}
.mot-wrap .mot-node:not(.root) .mot-node-kicker .pill {
  background: var(--mot-accent-soft, rgba(26,122,255,0.12));
  color: var(--mot-accent, #1a7aff);
}
.mot-wrap .mot-node:hover {
  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 12px 26px -8px var(--mot-accent-glow, rgba(26,122,255,0.3)),
    0 0 0 1.5px var(--mot-accent-glow, rgba(26,122,255,0.3));
}

/* Active leaf — the leaf this strategy most directly powers */
.mot-wrap .mot-node.active-leaf {
  border: 1.5px solid var(--mot-accent, #1a7aff);
  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 0 0 4px var(--mot-accent-soft),
    0 14px 30px -8px var(--mot-accent-glow);
  transform: translate(-50%, -50%) translateY(-1px);
}
.mot-wrap .mot-node.active-leaf .mot-node-title { color: var(--fg); }
.mot-active-tag {
  position: absolute;
  top: -9px; left: 10px;
  font-family: 'JetBrains Mono';
  font-size: 7.5px; font-weight: 800;
  letter-spacing: 0.12em;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--mot-accent, #1a7aff);
  color: white;
  white-space: nowrap;
  box-shadow: 0 4px 10px -2px var(--mot-accent-glow);
}

/* List-view active leaf + theming */
.mot-wrap .mol-row.root {
  background: linear-gradient(90deg, var(--mot-accent-soft, rgba(26,122,255,0.08)), transparent);
  border-color: var(--mot-accent-soft);
}
.mot-wrap .mol-row:hover { border-color: var(--mot-accent-soft); }
.mot-wrap .mol-row .mol-bar .fill {
  background: linear-gradient(90deg, var(--mot-accent, #1a7aff), color-mix(in srgb, var(--mot-accent, #1a7aff) 40%, #65d4e8 60%));
}
.mot-wrap .mol-row.active-leaf {
  background: var(--mot-accent-soft);
  border-color: var(--mot-accent);
}
.mot-wrap .mol-active {
  color: var(--mot-accent, #1a7aff);
  font-weight: 800;
}
.mot-wrap .mol-twist.open { color: var(--mot-accent, #1a7aff); }

/* Progress bar inside node */
.mot-progress {
  margin-top: 6px;
  height: 3px;
  border-radius: 2px;
  background: rgba(15,23,42,0.08);
  overflow: hidden;
}
.mot-node.root .mot-progress { background: rgba(255,255,255,0.25); }
.mot-progress .bar {
  height: 100%;
  background: linear-gradient(90deg, #1a7aff, #65d4e8);
  border-radius: 2px;
}
.mot-node.root .mot-progress .bar { background: white; }

/* ── List view ───────────────────────────────────────────────── */
.mot-list { padding: 4px 2px; }
.mol-row {
  display: grid;
  grid-template-columns: 22px 1fr 140px 80px 60px 28px;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: all 0.18s;
  cursor: pointer;
}
.mol-row:hover { background: rgba(255,255,255,0.72); border-color: rgba(26,122,255,0.25); }
.mol-row.root {
  background: linear-gradient(90deg, rgba(26,122,255,0.08), rgba(26,122,255,0.02));
  border-color: rgba(26,122,255,0.2);
  margin-bottom: 4px;
}
.mol-row.branch { padding-left: 28px; }
.mol-row.leaf { padding-left: 52px; font-size: 12px; }
.mol-twist {
  font-family: 'JetBrains Mono';
  font-size: 10px; font-weight: 700;
  color: var(--fg-faint);
  text-align: center;
  transition: transform 0.18s;
}
.mol-twist.open { transform: rotate(90deg); color: rgb(var(--accent-rgb)); }
.mol-twist.none { opacity: 0; }
.mol-kicker {
  font-family: 'JetBrains Mono';
  font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-transform: uppercase;
}
.mol-title {
  font-size: 12.5px; font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.01em;
  margin-top: 1px;
}
.mol-row.root .mol-title  { font-size: 13.5px; color: var(--fg); }
.mol-row.leaf .mol-title  { font-weight: 600; }
.mol-row.leaf .mol-kicker { display: none; }
.mol-row.leaf .mol-title  { margin-top: 0; }

.mol-bar {
  height: 5px;
  border-radius: 3px;
  background: rgba(15,23,42,0.07);
  overflow: hidden;
  position: relative;
}
.mol-bar .fill {
  position: absolute; inset: 0 auto 0 0;
  border-radius: 3px;
  background: linear-gradient(90deg, #1a7aff, #65d4e8);
}
.mol-row.root .mol-bar .fill { background: linear-gradient(90deg, #1a7aff, #0a6aee); }

.mol-stat {
  font-family: 'JetBrains Mono';
  font-size: 11px; font-weight: 700;
  color: var(--fg);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.mol-delta {
  font-family: 'JetBrains Mono';
  font-size: 10px; font-weight: 700;
  color: #10b981;
  text-align: right;
  background: rgba(16,185,129,0.1);
  padding: 3px 7px;
  border-radius: 5px;
}
.mol-delta.neg { color: #ef4444; background: rgba(239,68,68,0.1); }

.mol-chev {
  color: var(--fg-faint);
  transition: transform 0.18s;
}

/* ── Sankey view ─────────────────────────────────────────────── */
.mot-sankey {
  position: relative;
  padding: 10px 0 16px;
}
.mos-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.mos-cols {
  display: grid;
  grid-template-columns: 180px 1fr 180px;
  gap: 0;
  margin-bottom: 8px;
  padding: 0 6px;
}
.mos-col-head {
  font-family: 'JetBrains Mono';
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-transform: uppercase;
  padding: 4px 0;
}
.mos-col-head.mid { text-align: center; }
.mos-col-head.end { text-align: right; }

.mos-label-group {
  font-size: 11.5px; font-weight: 700;
  fill: var(--fg);
  letter-spacing: -0.005em;
}
.mos-label-sub {
  font-family: 'JetBrains Mono';
  font-size: 9px; font-weight: 700;
  fill: var(--fg-mute);
}
.mos-flow {
  opacity: 0.55;
  transition: opacity 0.25s;
}
.mos-flow:hover { opacity: 0.9; }
.mos-node-rect {
  transition: filter 0.2s;
}
.mos-node-rect:hover { filter: brightness(1.08); }

/* ═══════════════════════════════════════════════════════════════
   DECOMPOSED PROMPT — minimalist expandable slot rows
   Apple / Notion / Figma aesthetic: solid surfaces, hairlines,
   restrained color, generous whitespace.
   ═══════════════════════════════════════════════════════════════ */
.dpv-wrap {
  padding: 22px 24px 20px;
  border-radius: 16px;
  background: #ffffff;
  border: 1px solid rgba(15,23,42,0.08);
  box-shadow: 0 1px 2px rgba(15,23,42,0.03);
}
.dpv-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(15,23,42,0.06);
  gap: 16px;
}
.dpv-title-col {
  display: flex; flex-direction: column; gap: 3px;
}
.dpv-head .dpv-title {
  font-size: 15px; font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.018em;
  line-height: 1.2;
}
.dpv-sub {
  font-size: 11.5px;
  color: var(--fg-mute);
  letter-spacing: -0.005em;
}
.dpv-versions {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  padding: 3px;
  border-radius: 8px;
  background: rgba(15,23,42,0.04);
  border: 1px solid rgba(15,23,42,0.06);
}
.dpv-ver {
  font-family: 'JetBrains Mono';
  font-size: 10.5px; font-weight: 600;
  color: var(--fg-mute);
  letter-spacing: -0.01em;
  padding: 4px 8px;
  border-radius: 6px;
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: all 0.15s;
}
.dpv-ver:hover { color: var(--fg); background: rgba(255,255,255,0.8); }
.dpv-ver.current {
  color: var(--fg);
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(15,23,42,0.08), 0 0 0 1px rgba(15,23,42,0.05);
}

.dpv-prompt {
  padding: 14px 16px;
  border-radius: 10px;
  background: rgba(15,23,42,0.025);
  margin-bottom: 16px;
  font-family: 'JetBrains Mono';
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.dpv-prompt .token {
  padding: 0 2px;
  border-radius: 3px;
  font-weight: 500;
  border-bottom: 1.5px solid;
  transition: background 0.12s;
  cursor: help;
}
.dpv-prompt .token.t-role       { color: #0a4a99; border-bottom-color: rgba(26,122,255,0.55); }
.dpv-prompt .token.t-task       { color: #0b6c52; border-bottom-color: rgba(16,185,129,0.55); }
.dpv-prompt .token.t-context    { color: #8a5a14; border-bottom-color: rgba(245,166,35,0.55); }
.dpv-prompt .token.t-constraint { color: #96262e; border-bottom-color: rgba(239,68,68,0.55); }
.dpv-prompt .token.t-rubric     { color: #5c2a96; border-bottom-color: rgba(168,85,247,0.55); }
.dpv-prompt .token.t-role:hover       { background: rgba(26,122,255,0.08); }
.dpv-prompt .token.t-task:hover       { background: rgba(16,185,129,0.08); }
.dpv-prompt .token.t-context:hover    { background: rgba(245,166,35,0.09); }
.dpv-prompt .token.t-constraint:hover { background: rgba(239,68,68,0.08); }
.dpv-prompt .token.t-rubric:hover     { background: rgba(168,85,247,0.08); }

/* Expandable slot list */
.dpv-slots {
  display: flex; flex-direction: column;
}
.dpv-slot {
  border-top: 1px solid rgba(15,23,42,0.06);
  cursor: pointer;
  transition: background 0.15s;
}
.dpv-slot:last-child { border-bottom: 1px solid rgba(15,23,42,0.06); }
.dpv-slot:hover { background: rgba(15,23,42,0.018); }
.dpv-slot.open { background: rgba(15,23,42,0.022); }

.dpv-slot-row {
  display: grid;
  grid-template-columns: 14px 120px 1fr auto 14px;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
}
.dpv-slot-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(15,23,42,0.04);
  transition: box-shadow 0.18s;
}
.dpv-slot.active .dpv-slot-dot,
.dpv-slot.open .dpv-slot-dot {
  box-shadow: 0 0 0 4px rgba(15,23,42,0.05);
}
.dpv-slot-label {
  display: inline-flex; align-items: baseline; gap: 7px;
  min-width: 0;
}
.dpv-slot-name {
  font-size: 13px; font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.dpv-slot-count {
  font-family: 'JetBrains Mono';
  font-size: 10.5px; font-weight: 500;
  color: var(--fg-faint);
  letter-spacing: -0.01em;
}
.dpv-slot-preview {
  font-size: 12px;
  color: var(--fg-soft);
  letter-spacing: -0.005em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.dpv-slot-inline {
  display: inline-flex; align-items: center; gap: 14px;
  white-space: nowrap;
}
.dpv-inline-stat {
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: -0.005em;
  font-variant-numeric: tabular-nums;
}
.dpv-inline-stat b {
  font-family: 'JetBrains Mono';
  font-weight: 600;
  color: var(--fg);
  margin-right: 2px;
}
.dpv-inline-stat b.lift { color: #0b6c52; }
.dpv-heat {
  font-family: 'JetBrains Mono';
  font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(15,23,42,0.05);
  color: var(--fg-mute);
}
.dpv-heat.frozen { background: rgba(100,116,139,0.08); color: #64748b; }
.dpv-heat.warm   { background: rgba(245,166,35,0.12); color: #9a5f14; }
.dpv-heat.hot    { background: rgba(239,68,68,0.1); color: #b8322e; }
.dpv-slot-chev {
  color: var(--fg-faint);
  transition: transform 0.2s;
}
.dpv-slot.open .dpv-slot-chev { transform: rotate(180deg); color: var(--fg); }

/* Expanded detail */
.dpv-slot-detail {
  padding: 4px 4px 22px 44px;   /* indent under the dot */
  display: grid;
  gap: 14px;
  cursor: default;
}
.dpv-detail-text {
  font-family: 'JetBrains Mono';
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--fg);
  letter-spacing: -0.005em;
  padding: 12px 14px;
  background: rgba(15,23,42,0.025);
  border-radius: 8px;
  max-width: 720px;
}
.dpv-detail-kicker {
  font-family: 'Inter';
  font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--fg-faint);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.dpv-detail-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  max-width: 560px;
}
.dpv-stat {
  display: flex; flex-direction: column; gap: 6px;
}
.dpv-stat-label {
  font-size: 10.5px;
  color: var(--fg-mute);
  letter-spacing: -0.005em;
}
.dpv-stat-value {
  font-size: 17px; font-weight: 500;
  color: var(--fg);
  letter-spacing: -0.025em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.dpv-stat-sub {
  font-size: 11px;
  color: var(--fg-faint);
  font-weight: 400;
  letter-spacing: -0.01em;
}
.dpv-stat-sub-row {
  font-size: 10.5px;
  color: var(--fg-faint);
}
.dpv-mini-bar {
  height: 3px;
  border-radius: 2px;
  background: rgba(15,23,42,0.06);
  overflow: hidden;
}
.dpv-mini-bar .f {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}
.dpv-stat .dpv-card-spark { margin: 0; }

.dpv-detail-actions {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.dpv-action {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Inter';
  font-size: 11.5px; font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--fg);
  background: #ffffff;
  border: 1px solid rgba(15,23,42,0.12);
  padding: 5px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.12s;
}
.dpv-action:hover {
  border-color: rgba(15,23,42,0.22);
  background: #fbfbfc;
}
.dpv-action.primary {
  background: #0f172a;
  color: #fff;
  border-color: #0f172a;
}
.dpv-action.primary:hover {
  background: #1e293b;
  border-color: #1e293b;
}
.dpv-action svg { opacity: 0.8; }
.dpv-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px;
  padding: 0 5px;
  border-radius: 8px;
  background: rgba(255,255,255,0.22);
  font-family: 'JetBrains Mono';
  font-size: 10px; font-weight: 700;
  letter-spacing: 0;
  margin-left: -2px;
}
.dpv-action-note {
  font-size: 11.5px;
  color: var(--fg-faint);
  letter-spacing: -0.005em;
  padding: 5px 0;
}

@media (max-width: 820px) {
  .dpv-slot-row { grid-template-columns: 14px 96px 1fr 14px; }
  .dpv-slot-preview { display: none; }
  .dpv-detail-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ══════════════════════════════════════════════════════════════
   FOLDER SHELL — one translucent sheet with two tabs extruded
   from its top edge. Tabs share the base's material and merge
   into it seamlessly (flat bottoms). Title extrudes from the
   top-left; metrics extrude from the top-right.
   ══════════════════════════════════════════════════════════════ */
.folder-shell {
  position: relative;
  /* Enough room for the extruded tabs above the base. */
  padding-top: 52px;
}
/* Large variant — used for top-level numbered sections */
.folder-shell.size-lg {
  padding-top: 68px;
  margin-top: 18px;
}
.folder-shell.size-lg .folder-tabs {
  height: 68px;
}
.folder-shell.size-lg .folder-tab {
  border-radius: 22px 22px 0 0;
  padding: 14px 26px 18px;
}
.folder-shell.size-lg .folder-tab .ft-num {
  font-size: 12px;
  padding: 5px 13px;
}
.folder-shell.size-lg .folder-tab .ft-title {
  font-size: 20px;
  letter-spacing: -0.025em;
}
.folder-shell.size-lg .folder-tab .ft-sub {
  font-size: 12.5px;
  margin-top: 3px;
}
.folder-shell.size-lg .folder-tab .ft-info {
  width: 22px; height: 22px;
  font-size: 12px;
}
.folder-shell.size-lg .tab-stats {
  gap: 26px;
}
.folder-shell.size-lg .tab-stats .ts-v {
  font-size: 18px;
}
.folder-shell.size-lg .tab-stats .ts-l {
  font-size: 9.5px;
  margin-top: 5px;
}
.folder-shell.size-lg .folder-base {
  border-radius: 26px;
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
}
.folder-shell.size-lg .folder-body {
  padding: 26px 22px 22px;
}
.folder-shell.size-lg .folder-body.no-pad {

}
.folder-tabs {
  position: absolute;
  top: 0;
  /* Align tabs' bottoms precisely with the base's top edge. */
  bottom: auto;
  left: 0;
  right: 0;
  height: 52px;
  display: flex;
  align-items: stretch;
  justify-content: space-between;  /* title left, metrics right */
  gap: 14px;
  padding: 0 4px;
  z-index: 2;
  pointer-events: none;
}
/* Tabs are made of the SAME glass as the base. Flat bottom corners
   so they visually merge into the base; rounded top corners only. */
.folder-tab {
  pointer-events: auto;
  border-radius: 18px 18px 0 0;
  padding: 10px 20px 14px;   /* extra bottom so content isn't cramped against the merge line */
  display: flex; align-items: center; gap: 14px;
  position: relative;
  flex: 0 0 auto;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42));
  border: 1px solid rgba(255,255,255,0.72);
  border-bottom: none;  /* remove the seam where tab meets base */
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  /* Dimensional lift: inner top highlight, soft shadow to the
     sides to show the tab is raised but attached. Shadow does NOT
     cast downward, to avoid a gap below the tab. */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    -6px 0 14px -10px rgba(30,50,100,0.22),
    6px 0 14px -10px rgba(30,50,100,0.22);
}
/* A crisp hairline only across the tab's top curve, for extra
   definition against busy backgrounds. */
.folder-tab::before {
  content: "";
  position: absolute;
  top: 0; left: 8px; right: 8px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  border-radius: 1px;
  pointer-events: none;
}
/* A 1px overdraw at the very bottom of the tab blends the tab
   into the base by covering the base's top border across the
   tab's width. (Slightly lighter than the base's own top
   highlight so there's no visible seam.) */
.folder-tab::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.75) 0%,
    rgba(255,255,255,0.45) 100%);
  pointer-events: none;
}
.folder-tab .ft-num {
  font-family: 'JetBrains Mono';
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em;
  color: rgb(var(--accent-rgb));
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(26,122,255,0.1);
  border: 1px solid rgba(26,122,255,0.22);
  flex-shrink: 0;
}
.folder-tab .ft-titles { min-width: 0; flex: 1; }
.folder-tab .ft-title {
  font-size: 15px; font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
  line-height: 1.1;
}
.folder-tab .ft-sub {
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: -0.005em;
  margin-top: 2px;
}
.folder-tab .ft-info {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(26,122,255,0.12);
  border: 1px solid rgba(26,122,255,0.3);
  color: #0a6aee;
  font-family: 'JetBrains Mono';
  font-size: 11px; font-weight: 700;
  cursor: help;
  position: relative;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.folder-tab .ft-info:hover { background: rgba(26,122,255,0.22); transform: scale(1.08); }
.folder-tab .ft-info::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  transform: translateY(-4px);
  width: 360px;
  padding: 12px 15px;
  border-radius: 10px;
  background: rgba(20,30,55,0.95);
  color: #f2f6ff;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: -0.005em;
  line-height: 1.5;
  text-align: left;
  box-shadow: 0 20px 40px -16px rgba(10,20,40,0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 100;
  white-space: normal;
}
.folder-tab .ft-info::before {
  content: "";
  position: absolute;
  top: calc(100% + 2px);
  left: 8px;
  border: 5px solid transparent;
  border-bottom-color: rgba(20,30,55,0.95);
  opacity: 0;
  transition: opacity 0.18s ease;
  z-index: 101;
}
.folder-tab .ft-info:hover::after,
.folder-tab .ft-info:hover::before {
  opacity: 1;
  transform: translateY(0);
}

/* Standardized metrics display used in every folder-tab.
   Consistent typography + spacing across all sections. */
.tab-stats {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 0;
}
.tab-stats > .ts-cell {
  display: flex;
  flex-direction: column;

}
.tab-stats .ts-v {

.tab-stats .ts-v .ts-unit {

}
.tab-stats .ts-l {
  font-family: 'JetBrains Mono';

  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;

}
.tab-stats .ts-cell.hi .ts-v { color: #0a4fb0; }
.tab-stats .ts-cell.hi .ts-l { color: #0a6aee; }

/* Base sheet sits flush beneath the tabs. Tabs' flat bottoms
   merge into its top edge — no margin overlap needed. */
.folder-base {
  position: relative;
  margin-top: 0;
  border-radius: 22px;
  /* Flatten top-left & top-right so the tab-merge line is crisp
     (the tabs carry the rounded corners in that region). */
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.34));

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),

  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  z-index: 1;
}
.folder-body {
  position: relative;
  padding: 20px 18px 18px;
}
.folder-body.no-pad {
  padding: 20px 0 0;
}

/* ═══════════════════════════════════════════════════════════════
   FLOATING TOC — right-side glass index rail
   Matches visionOS glass theme: translucent white surface,
   hairline border, subtle shadow, restrained accent colors.
   ═══════════════════════════════════════════════════════════════ */
.ftoc {
  position: fixed;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 120;
  width: 224px;
  max-height: 78vh;
  padding: 14px 12px 12px;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(250,252,255,0.38) 100%);
  border: 1px solid rgba(255,255,255,0.75);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.98) inset,
    0 0 0 1px rgba(255,255,255,0.4) inset,
    0 0 0 1px rgba(15,23,42,0.04),
    0 28px 58px -22px rgba(15,23,42,0.32),
    0 10px 24px -12px rgba(15,23,42,0.18),
    0 2px 6px -3px rgba(15,23,42,0.08);
  backdrop-filter: blur(40px) saturate(2);
  -webkit-backdrop-filter: blur(40px) saturate(2);
  display: flex; flex-direction: column;
  transition:
    width 0.42s cubic-bezier(0.22, 1.2, 0.36, 1),
    padding 0.42s cubic-bezier(0.22, 1.2, 0.36, 1),
    border-radius 0.42s cubic-bezier(0.22, 1.2, 0.36, 1),
    box-shadow 0.35s ease;
  overflow: hidden;
}
.ftoc::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,0.35), transparent 55%),
    radial-gradient(100% 100% at 100% 0%, rgba(200,220,255,0.18), transparent 60%);
  opacity: 0.9;
}
.ftoc:hover {
  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 0 0 1px rgba(255,255,255,0.5) inset,
    0 0 0 1px rgba(15,23,42,0.05),
    0 36px 70px -22px rgba(15,23,42,0.36),
    0 14px 28px -10px rgba(26,122,255,0.18),
    0 2px 6px -3px rgba(15,23,42,0.08);
}
.ftoc.collapsed {
  width: 44px;
  padding: 10px 6px;
  border-radius: 999px;
}
.ftoc.collapsed .ftoc-head {
  border-bottom: none;
  padding-bottom: 0;
  margin-bottom: 0;
  justify-content: center;
}
.ftoc.collapsed .ftoc-nav { display: none; }
.ftoc-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px 10px;
  border-bottom: 1px solid rgba(15,23,42,0.06);
  margin-bottom: 8px;
  gap: 8px;
  position: relative;
  z-index: 1;
}
.ftoc-kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: 'JetBrains Mono';
  font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--fg-mute);
  transition: opacity 0.2s;
}
.ftoc.collapsed .ftoc-kicker { opacity: 0; pointer-events: none; }
.ftoc-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #1a7aff;
  box-shadow: 0 0 0 2px rgba(26,122,255,0.18), 0 0 6px rgba(26,122,255,0.5);
  animation: ftoc-pulse 2.4s ease-in-out infinite;
}
@keyframes ftoc-pulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(26,122,255,0.18), 0 0 6px rgba(26,122,255,0.5); }
  50%      { box-shadow: 0 0 0 2px rgba(26,122,255,0.28), 0 0 10px rgba(26,122,255,0.75); }
}
.ftoc-collapse {
  width: 24px; height: 24px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.45);
  color: var(--fg-mute);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
  transition: all 0.18s cubic-bezier(.22,1.2,.36,1);
  flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 1px 3px -1px rgba(15,23,42,0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: relative;
  z-index: 2;
}
.ftoc-collapse:hover {
  background: rgba(255,255,255,0.85);
  color: var(--fg);
  border-color: rgba(26,122,255,0.35);
  transform: scale(1.06);
}
.ftoc-collapse:active { transform: scale(0.94); }
.ftoc.collapsed .ftoc-collapse {
  width: 28px; height: 28px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(240,247,255,0.7));
  border-color: rgba(26,122,255,0.22);
  color: #0a4fb0;
}
.ftoc.collapsed .ftoc-collapse:hover {
  background: linear-gradient(180deg, #fff, rgba(235,245,255,0.95));
  border-color: rgba(26,122,255,0.45);
}

.ftoc-nav {
  display: flex; flex-direction: column;
  gap: 1px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 2px;
  scrollbar-width: none;
  position: relative;
  z-index: 1;
}
.ftoc-nav::-webkit-scrollbar { display: none; }

.ftoc-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px 7px 12px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  color: var(--fg-soft);
  font-family: 'Inter';
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.005em;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ftoc-item:hover {
  color: var(--fg);
  background: rgba(15,23,42,0.035);
}
.ftoc-item.depth-1 {
  padding-left: 20px;
  font-size: 11.5px;
  color: var(--fg-mute);
  font-weight: 500;
}
.ftoc-item.depth-1:hover { color: var(--fg-soft); }
.ftoc-item.active {
  color: var(--fg);
  font-weight: 600;
  background: linear-gradient(90deg, rgba(26,122,255,0.09), rgba(26,122,255,0.02));
}
.ftoc-item.active.depth-1 {
  color: var(--fg);
  font-weight: 600;
}

/* Left active-indicator bar */
.ftoc-bar {
  position: absolute;
  left: 3px;
  top: 50%;
  transform: translateY(-50%) scaleY(0);
  width: 2.5px;
  height: 18px;
  border-radius: 2px;
  background: linear-gradient(180deg, #65d4e8, #1a7aff);
  box-shadow: 0 0 8px rgba(26,122,255,0.4);
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.ftoc-item.active .ftoc-bar { transform: translateY(-50%) scaleY(1); }

.ftoc-num {
  font-family: 'JetBrains Mono';
  font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--fg-faint);
  min-width: 18px;
  transition: color 0.15s;
  flex-shrink: 0;
}
.ftoc-item.active .ftoc-num { color: #1a7aff; }

.ftoc-tick {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(15,23,42,0.22);
  margin-left: 2px;
  transition: all 0.18s;
  flex-shrink: 0;
}
.ftoc-item:hover .ftoc-tick { background: rgba(15,23,42,0.45); }
.ftoc-item.active .ftoc-tick {
  background: #1a7aff;
  box-shadow: 0 0 6px rgba(26,122,255,0.55);
}

.ftoc-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s;
}
.ftoc.collapsed .ftoc-label,
.ftoc.collapsed .ftoc-num {
  opacity: 0;
  pointer-events: none;
}
.ftoc.collapsed .ftoc-item {
  padding: 7px 6px;
  justify-content: center;
}
.ftoc.collapsed .ftoc-item.depth-1 { padding-left: 6px; }

/* Hide entirely on narrow viewports */
@media (max-width: 1180px) {
  .ftoc { display: none; }
}

</style>

<script type="text/babel" data-src="vp-project/panels.jsx">
/* global React, Ic */
const { useState: useSp, useEffect: useEpSp, useRef: useRefSp } = React;

/* ══════════════════════════════════════════════════════════════
   ORBITAL DIGITAL TWIN — glass pebble nodes + particle flow edges
   ══════════════════════════════════════════════════════════════ */
function DigitalTwin() {
  // Vertical pipeline — flow reads top→bottom. Agents bookend the artifact chain.
  // Feedback loop arcs up the right side from Agent B back into the pipeline.
  // Rendered on a 100×100 viewBox. Nodes placed by percent, edges as SVG paths.
  const CX = 40;  // pipeline spine (balanced with loop bowing to bx=64)
  const nodes = {
    agentA:   { x: CX, y: 14, type: "agent",   letter: "A", label: "EXPLORE", role: "proposes prompts" },
    prompt:   { x: CX, y: 30, type: "artifact", title: "Prompt v4.2", sub: "2,840 tokens", primary: true },
    evalRun:  { x: CX, y: 44, type: "artifact", title: "Eval Run",    sub: "412 docs" },
    outputs:  { x: CX, y: 58, type: "artifact", title: "Outputs",     sub: "412 scored" },
    rubric:   { x: CX, y: 72, type: "artifact", title: "Rubric",      sub: "6 axes" },
    agentB:   { x: CX, y: 86, type: "agent",   letter: "B", label: "SCORE",   role: "grades & lifts" },
  };

  // Forward pipeline edges + one feedback loop along the right gutter.
  const edges = [
    { from: "agentA",  to: "prompt",  label: "proposes",  phase: 0 },
    { from: "prompt",  to: "evalRun", label: "runs on",   phase: 1 },
    { from: "evalRun", to: "outputs", label: "yields",    phase: 2 },
    { from: "outputs", to: "rubric",  label: "graded by", phase: 3 },
    { from: "rubric",  to: "agentB",  label: "signal",    phase: 4 },
    { from: "agentB",  to: "agentA",  label: "feedback",  phase: 5, loop: true },
  ];

  // Animate the active phase
  const [tick, setTick] = useSp(0);
  useEpSp(() => {
    const id = setInterval(() => setTick(t => t + 1), 900);
    return () => clearInterval(id);
  }, []);
  const activePhase = tick % edges.length;

  const asXY = (id) => nodes[id];

  // Path generator: artifacts sit on a vertical spine (same x);
  // forward edges are short vertical segments. Feedback bows out to the right.
  function edgePath(e) {
    const a = asXY(e.from), b = asXY(e.to);
    if (e.loop) {
      // feedback: big arc from Agent B back up to Agent A along the right gutter
      const bx = 64;  // arc bows right (balanced: pipeline at x=40, arc to x=64 → center ~50)
      return `M${a.x + 4} ${a.y} C${bx} ${a.y}, ${bx} ${b.y}, ${b.x + 4} ${b.y}`;
    }
    // straight vertical segment down the spine
    return `M${a.x} ${a.y + 2} L${b.x} ${b.y - 2}`;
  }

  // Label position: next to the forward arrows (on the right of spine),
  // and mid-arc for the feedback loop.
  function labelPos(e) {
    const a = asXY(e.from), b = asXY(e.to);
    if (e.loop) return { x: 66, y: (a.y + b.y) / 2 };
    return { x: a.x + 10, y: (a.y + b.y) / 2 };
  }

  return (
    <div className="dt-wrap">
      <div className="dt-legend">
        <span className="dt-leg-item"><i className="dt-leg-dot agent"/>Agent</span>
        <span className="dt-leg-item"><i className="dt-leg-dot artifact"/>Artifact</span>
        <span className="dt-leg-item"><span className="dt-leg-flow">•</span>Active signal</span>
      </div>

      <div className="dt-stage">
        <svg className="dt-edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden>
          <defs>
            <marker id="dt-arrow" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#1a7aff"/>
            </marker>
            <marker id="dt-arrow-active" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#0a5ad4"/>
            </marker>
          </defs>
          {edges.map((e, i) => {
            const isActive = i === activePhase;
            return (
              <path key={i}
                    d={edgePath(e)}
                    fill="none"
                    stroke={isActive ? "#0a5ad4" : "rgba(26,122,255,0.35)"}
                    strokeWidth={isActive ? 0.55 : 0.35}
                    strokeDasharray={e.loop ? "1,0.8" : "0"}
                    markerEnd={`url(#${isActive ? "dt-arrow-active" : "dt-arrow"})`}
                    style={{ transition: "stroke 0.4s, stroke-width 0.4s" }}/>
            );
          })}
          {/* flowing pulse along active edge */}
          {edges.map((e, i) => {
            if (i !== activePhase) return null;
            const pct = ((tick * 12) % 100) / 100;
            return (
              <circle key={"p-"+i} r="0.9" fill="#0a5ad4">
                <animateMotion dur="0.9s" repeatCount="indefinite"
                               path={edgePath(e)}/>
              </circle>
            );
          })}
        </svg>

        {edges.map((e, i) => {
          const pos = labelPos(e);
          const isActive = i === activePhase;
          return (
            <div key={"l-"+i}
                 className={"dt-edge-label" + (isActive ? " active" : "")}
                 style={{ left: pos.x + "%", top: pos.y + "%" }}>
              {e.label}
            </div>
          );
        })}

        {Object.entries(nodes).map(([id, n]) => {
          if (n.type === "agent") {
            return (
              <div key={id}
                   className={"dt-node dt-agent" + (id === "agentA" ? " explore" : " score")}
                   style={{ left: n.x + "%", top: n.y + "%" }}>
                <div className="dt-agent-letter">{n.letter}</div>
                <div className="dt-agent-label">Agent {n.letter}</div>
                <div className="dt-agent-role">{n.label}</div>
              </div>
            );
          }
          return (
            <div key={id}
                 className={"dt-node dt-art" + (id === "prompt" ? " primary" : "")}
                 style={{ left: n.x + "%", top: n.y + "%" }}>
              <div className="dt-art-title">{n.title}</div>
              <div className="dt-art-sub">{n.sub}</div>
            </div>
          );
        })}
      </div>

      <div className="dt-foot">
        <div className="dt-stat"><span className="dt-stat-v">12</span><span className="dt-stat-l">iterations</span></div>
        <div className="dt-stat"><span className="dt-stat-v">0.84</span><span className="dt-stat-l">best quality</span></div>
        <div className="dt-stat"><span className="dt-stat-v">+0.20</span><span className="dt-stat-l">lift this run</span></div>
        <div className="dt-stat"><span className="dt-stat-v">running</span><span className="dt-stat-l">eta 4 iters</span></div>
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════
   HOLOGRAPHIC OSCILLOSCOPE — agent quality readout with bloom
   ══════════════════════════════════════════════════════════════ */
function AgentChart({ series, target=0.82, color="#1a7aff", baseline, gid }) {
  const W=260, H=104;
  const padL=28, padR=10, padT=12, padB=22;
  const pw = W - padL - padR, ph = H - padT - padB;
  const iters = series.length;
  const x = (i) => padL + (i/(iters-1)) * pw;
  const y = (v) => padT + (1-v) * ph;
  const mainPts = series.map((v,i) => [x(i), y(v)]);
  const basePts = baseline ? baseline.map((v,i) => [x(i), y(v)]) : null;
  const toP = (pts) => pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const fillD = toP(mainPts) + ` L ${x(iters-1)} ${y(0)} L ${x(0)} ${y(0)} Z`;
  const last = mainPts[mainPts.length-1];

  // pulse animation
  const [tk, setTk] = useSp(0);
  useEpSp(() => {
    let r; const loop = () => { setTk(t => t+1); r = requestAnimationFrame(loop); };
    r = requestAnimationFrame(loop); return () => cancelAnimationFrame(r);
  }, []);
  const pulse = 3 + 2 * Math.sin(tk * 0.07);

  return (
    <svg className="agent-chart" viewBox={`0 0 ${W} ${H}`}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.42"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
        </linearGradient>
        <filter id={gid+"-bloom"} x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
        </filter>
        <linearGradient id={gid+"-line"} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor={color} stopOpacity="0.4"/>
          <stop offset="100%" stopColor={color} stopOpacity="1"/>
        </linearGradient>
      </defs>

      {/* grid — fades from center */}
      {[0,0.25,0.5,0.75,1].map(tv => (
        <line key={tv} x1={padL} x2={W-padR} y1={y(tv)} y2={y(tv)}
          stroke="rgba(120,140,180,0.18)" strokeWidth="0.4"
          strokeDasharray={tv===0 ? "" : "2 3"}/>
      ))}
      {[0,0.25,0.5,0.75,1].map(tv => (
        <text key={"t"+tv} x={padL-5} y={y(tv)+2.5} textAnchor="end" fontSize="7" fill="#a6b0c0">{tv.toFixed(1)}</text>
      ))}

      {/* target */}
      <line x1={padL} x2={W-padR} y1={y(target)} y2={y(target)}
        stroke="#10b981" strokeWidth="0.7" strokeDasharray="3 2" opacity="0.55"/>
      <text x={W-padR-2} y={y(target)-3} textAnchor="end" fontSize="6.5" fill="#10b981" fontWeight="700">target {target}</text>

      {/* baseline */}
      {basePts && <path d={toP(basePts)} fill="none" stroke="#a6b0c0" strokeWidth="0.8" strokeDasharray="2 2" opacity="0.55"/>}

      {/* fill */}
      <path d={fillD} fill={`url(#${gid})`}/>

      {/* bloom halo (behind line) */}
      <path d={toP(mainPts)} fill="none" stroke={color} strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" opacity="0.35" filter={`url(#${gid}-bloom)`}/>
      {/* main line */}
      <path d={toP(mainPts)} fill="none" stroke={`url(#${gid}-line)`} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>

      {/* pulsing endpoint */}
      <circle cx={last[0]} cy={last[1]} r={pulse} fill={color} opacity="0.18"/>
      <circle cx={last[0]} cy={last[1]} r="2.4" fill="white" stroke={color} strokeWidth="1.6"/>
      <text x={last[0]-4} y={last[1]-5} textAnchor="end" fontSize="8" fontWeight="700" fill={color}>
        {series[series.length-1].toFixed(2)}
      </text>

      <text x={(padL+W-padR)/2} y={H-5} textAnchor="middle" fontSize="7" fill="#7a8698">iteration · 1 → {iters}</text>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════════
   POTENTIAL-SURFACE PHASE DIAGRAM — isobars + comet trajectory
   ══════════════════════════════════════════════════════════════ */
const DEFAULT_PHASE_CFG = {
  title: "Phase Diagram — Prompt Optimization Landscape",
  axes: { x: "EXPLORATION  (temperature · sampling breadth)", y: "SPECIFICITY  (constraints)" },
  regime: { optimal: "Optimal regime", hot: "Under-constrained", cold: "Over-constrained" },
};
window.DEFAULT_PHASE_CFG = DEFAULT_PHASE_CFG;
function PhaseDiagram({ cfg }) {
  cfg = cfg || (window.PHASE_CFG || DEFAULT_PHASE_CFG);
  const W = 380, H = 240;
  const padL = 32, padR = 18, padT = 20, padB = 32;
  const pw = W - padL - padR, ph = H - padT - padB;
  const X = (e) => padL + e * pw;
  const Y = (s) => padT + (1-s) * ph;

  // trajectory — walks from noisy (low spec, high explore) toward optimum
  const traj = [
    [0.12, 0.90],[0.20, 0.80],[0.30, 0.72],[0.40, 0.66],
    [0.48, 0.60],[0.54, 0.56],[0.60, 0.54],
  ];
  const cx = 0.6, cy = 0.54;   // optimum
  const crit = [0.82, 0.30];   // critical point (over-constrained edge)

  // smooth trajectory via Catmull-Rom-ish cubic
  const trajD = (() => {
    let d = "M" + X(traj[0][0]) + " " + Y(traj[0][1]);
    for (let i=0; i<traj.length-1; i++) {
      const p0 = traj[Math.max(0,i-1)], p1 = traj[i], p2 = traj[i+1], p3 = traj[Math.min(traj.length-1,i+2)];
      const c1x = X(p1[0]) + (X(p2[0]) - X(p0[0]))/6;
      const c1y = Y(p1[1]) + (Y(p2[1]) - Y(p0[1]))/6;
      const c2x = X(p2[0]) - (X(p3[0]) - X(p1[0]))/6;
      const c2y = Y(p2[1]) - (Y(p3[1]) - Y(p1[1]))/6;
      d += ` C${c1x} ${c1y} ${c2x} ${c2y} ${X(p2[0])} ${Y(p2[1])}`;
    }
    return d;
  })();

  // comet animation along smooth path
  const [tk, setTk] = useSp(0);
  useEpSp(() => {
    let r; const loop = () => { setTk(t => t+1); r = requestAnimationFrame(loop); };
    r = requestAnimationFrame(loop); return () => cancelAnimationFrame(r);
  }, []);
  // sample cubic position
  const sampleCubic = (u) => {
    const seg = u * (traj.length-1);
    const i = Math.min(traj.length-2, Math.floor(seg));
    const t = seg - i;
    const p0 = traj[Math.max(0,i-1)], p1 = traj[i], p2 = traj[i+1], p3 = traj[Math.min(traj.length-1,i+2)];
    const c1x = X(p1[0]) + (X(p2[0]) - X(p0[0]))/6;
    const c1y = Y(p1[1]) + (Y(p2[1]) - Y(p0[1]))/6;
    const c2x = X(p2[0]) - (X(p3[0]) - X(p1[0]))/6;
    const c2y = Y(p2[1]) - (Y(p3[1]) - Y(p1[1]))/6;
    const b = (a,b,c,d,t) => (1-t)**3*a + 3*(1-t)**2*t*b + 3*(1-t)*t*t*c + t**3*d;
    return [b(X(p1[0]), c1x, c2x, X(p2[0]), t), b(Y(p1[1]), c1y, c2y, Y(p2[1]), t)];
  };
  const u = ((tk * 0.003) % 1 + 1) % 1;
  const [px, py] = sampleCubic(u);
  // short trail
  const trail = Array.from({length: 8}, (_, k) => {
    const uu = (u - k * 0.012 + 1) % 1;
    return sampleCubic(uu);
  });

  // isometric skew for 3D feel — we apply transform to the plot group
  // concentric potential rings (iso)
  const rings = [0.08, 0.16, 0.26, 0.38, 0.50];

  return (
    <svg className="phase-svg" viewBox={`0 0 ${W} ${H}`}>
      <defs>
        {/* deep violet→indigo bowl floor */}
        <radialGradient id="pd-floor" cx="50%" cy="55%" r="72%">
          <stop offset="0%"   stopColor="#f8f7ff" stopOpacity="0.9"/>
          <stop offset="55%"  stopColor="#eef0fb" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#dde2f3" stopOpacity="0.30"/>
        </radialGradient>
        {/* warm "too hot" gradient — top-left corner */}
        <radialGradient id="pd-hot" cx="6%" cy="6%" r="42%">
          <stop offset="0%"  stopColor="#ffd4c2" stopOpacity="0.28"/>
          <stop offset="70%" stopColor="#ffd4c2" stopOpacity="0.03"/>
          <stop offset="100%" stopColor="#ffd4c2" stopOpacity="0"/>
        </radialGradient>
        {/* cool "too cold" gradient — bottom-right corner */}
        <radialGradient id="pd-cold" cx="94%" cy="94%" r="42%">
          <stop offset="0%"  stopColor="#bec8e2" stopOpacity="0.24"/>
          <stop offset="70%" stopColor="#bec8e2" stopOpacity="0.03"/>
          <stop offset="100%" stopColor="#bec8e2" stopOpacity="0"/>
        </radialGradient>
        {/* optimum glow — soft aurora */}
        <radialGradient id="pd-opt" cx="50%" cy="50%" r="55%">
          <stop offset="0%"   stopColor="#ffffff" stopOpacity="0.95"/>
          <stop offset="32%"  stopColor="#e4e9fb" stopOpacity="0.75"/>
          <stop offset="65%"  stopColor="#b8c4ee" stopOpacity="0.30"/>
          <stop offset="100%" stopColor="#8a9cdb" stopOpacity="0"/>
        </radialGradient>
        {/* comet head */}
        <radialGradient id="pd-comet" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stopColor="#ffffff" stopOpacity="1"/>
          <stop offset="40%" stopColor="#a8c7ff" stopOpacity="0.9"/>
          <stop offset="100%" stopColor="#4a7cff" stopOpacity="0"/>
        </radialGradient>
        {/* trajectory gradient along path */}
        <linearGradient id="pd-traj" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"  stopColor="#a8b8e0" stopOpacity="0.35"/>
          <stop offset="70%" stopColor="#6a8cff" stopOpacity="0.95"/>
          <stop offset="100%" stopColor="#ffffff" stopOpacity="1"/>
        </linearGradient>
        <filter id="pd-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4"/>
        </filter>
        <filter id="pd-blur2" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
        {/* ring stroke with chromatic edge */}
        <linearGradient id="pd-ring" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stopColor="#8ea1e8" stopOpacity="0.45"/>
          <stop offset="50%" stopColor="#5a73c9" stopOpacity="0.80"/>
          <stop offset="100%" stopColor="#8ea1e8" stopOpacity="0.45"/>
        </linearGradient>
        <clipPath id="pd-clip">
          <rect x={padL} y={padT} width={pw} height={ph} rx="6"/>
        </clipPath>
      </defs>

      {/* ───── plot background (glass bowl) ───── */}
      <rect x={padL} y={padT} width={pw} height={ph} rx="6"
        fill="rgba(255,255,255,0.55)" stroke="rgba(20,30,60,0.08)" strokeWidth="0.5"/>
      <g clipPath="url(#pd-clip)">
        <rect x={padL} y={padT} width={pw} height={ph} fill="url(#pd-floor)"/>
        <rect x={padL} y={padT} width={pw} height={ph} fill="url(#pd-hot)"/>
        <rect x={padL} y={padT} width={pw} height={ph} fill="url(#pd-cold)"/>

        {/* grid — very faint */}
        {[0.25,0.5,0.75].map(tv => (
          <g key={tv} opacity="0.35">
            <line x1={X(tv)} x2={X(tv)} y1={padT+2} y2={H-padB-2} stroke="rgba(60,80,120,0.10)" strokeWidth="0.4"/>
            <line x1={padL+2} x2={W-padR-2} y1={Y(tv)} y2={Y(tv)} stroke="rgba(60,80,120,0.10)" strokeWidth="0.4"/>
          </g>
        ))}

        {/* optimum aurora (blurred, behind rings) */}
        <g transform={`translate(${X(cx)} ${Y(cy)})`}>
          <ellipse cx="0" cy="0" rx={0.55*pw} ry={0.48*ph} fill="url(#pd-opt)" filter="url(#pd-blur)"/>
        </g>

        {/* iso potential rings — elliptic with slight tilt */}
        <g transform={`translate(${X(cx)} ${Y(cy)}) rotate(-8)`}>
          {rings.map((r,i) => (
            <ellipse key={i} cx="0" cy="0"
              rx={r*pw} ry={r*ph*0.78}
              fill="none" stroke="url(#pd-ring)"
              strokeWidth={i===0 ? 1.1 : 0.65}
              strokeDasharray={i===0 ? "" : "2.5 3"}
              opacity={0.85 - i*0.12}
              vectorEffect="non-scaling-stroke"/>
          ))}
          {/* tiny specular highlight on innermost ring */}
          <ellipse cx={-rings[0]*pw*0.35} cy={-rings[0]*ph*0.35}
            rx={rings[0]*pw*0.25} ry={rings[0]*ph*0.18}
            fill="rgba(255,255,255,0.7)" filter="url(#pd-blur2)"/>
        </g>

        {/* trajectory — glow underlay + crisp line */}
        <path d={trajD} fill="none" stroke="#6a8cff" strokeWidth="5" opacity="0.25" filter="url(#pd-blur2)"/>
        <path d={trajD} fill="none" stroke="url(#pd-traj)" strokeWidth="1.4"
          strokeLinecap="round" strokeDasharray="4 2.5" opacity="0.9"/>

        {/* trailing particles behind comet */}
        {trail.map(([tx,ty], i) => (
          <circle key={i} cx={tx} cy={ty}
            r={3.2 - i*0.3}
            fill="#a8c7ff"
            opacity={(0.55 - i*0.06)}
            filter="url(#pd-blur2)"/>
        ))}
        {/* comet head — glow + core */}
        <circle cx={px} cy={py} r="9" fill="url(#pd-comet)"/>
        <circle cx={px} cy={py} r="2.2" fill="#ffffff"/>
        <circle cx={px-0.6} cy={py-0.6} r="0.8" fill="#ffffff"/>

        {/* v4.2 anchor — glass pin at traj end */}
        {(() => {
          const ex = X(traj[traj.length-1][0]);
          const ey = Y(traj[traj.length-1][1]);
          return (
            <g>
              <circle cx={ex} cy={ey} r="9" fill="rgba(106,140,255,0.18)"/>
              <circle cx={ex} cy={ey} r="5" fill="rgba(255,255,255,0.9)" stroke="#4a7cff" strokeWidth="1.2"/>
              <circle cx={ex-1.2} cy={ey-1.4} r="1.1" fill="#ffffff"/>
            </g>
          );
        })()}

        {/* critical point — subtle crosshair, no hard red leader */}
        {(() => {
          const rx = X(crit[0]), ry = Y(crit[1]);
          return (
            <g opacity="0.85">
              <circle cx={rx} cy={ry} r="10" fill="none" stroke="#e07a5f" strokeWidth="0.6" opacity="0.5"/>
              <circle cx={rx} cy={ry} r="4"  fill="none" stroke="#e07a5f" strokeWidth="0.8" strokeDasharray="2 2"/>
              <circle cx={rx} cy={ry} r="1.4" fill="#e07a5f"/>
            </g>
          );
        })()}
      </g>

      {/* ───── glass chip labels (on top of plot) ───── */}
      {/* Optimal Regime — at optimum */}
      <g transform={`translate(${X(cx)} ${Y(cy) - 54})`}>
        <rect x="-46" y="-10" width="92" height="18" rx="9"
          fill="rgba(255,255,255,0.9)" stroke="rgba(90,115,201,0.35)" strokeWidth="0.5"/>
        <circle cx="-35" cy="-1" r="2.2" fill="#5a73c9"/>
        <text x="-29" y="2.5" fontSize="9" fontWeight="700" fill="#2e3d73" letterSpacing="0.2">{cfg.regime.optimal}</text>
      </g>

      {/* hot zone marker */}
      <g transform={`translate(${padL+8} ${padT+11})`} opacity="0.75">
        <circle cx="0" cy="0" r="2" fill="#d99a80"/>
        <text x="7" y="3" fontSize="7.5" fontWeight="600" fill="#a05a3f" letterSpacing="0.18">{cfg.regime.hot}</text>
      </g>

      {/* cold zone marker */}
      <g transform={`translate(${W-padR-8} ${H-padB-11})`} opacity="0.75">
        <circle cx="0" cy="0" r="2" fill="#9fb3d9"/>
        <text x="-7" y="3" fontSize="7.5" fontWeight="600" fill="#5c6fa0" letterSpacing="0.18" textAnchor="end">{cfg.regime.cold}</text>
      </g>

      {/* v4.2 chip next to pin */}
      <g transform={`translate(${X(traj[traj.length-1][0]) + 18} ${Y(traj[traj.length-1][1]) - 12})`}>
        <rect x="-2" y="-8" width="30" height="14" rx="7"
          fill="rgba(74,124,255,0.95)"/>
        <text x="13" y="1.5" fontSize="8.2" fontWeight="700" fill="#ffffff" textAnchor="middle" letterSpacing="0.3">v4.2</text>
      </g>

      {/* critical chip */}
      <g transform={`translate(${X(crit[0]) - 4} ${Y(crit[1]) - 18})`}>
        <rect x="-34" y="-8" width="36" height="14" rx="7"
          fill="rgba(255,255,255,0.88)" stroke="rgba(224,122,95,0.4)" strokeWidth="0.5"/>
        <text x="-16" y="1.5" fontSize="7.5" fontWeight="600" fill="#b34a28" textAnchor="middle" letterSpacing="0.2">critical</text>
      </g>

      {/* axes — thin, neutral */}
      <text x={(padL+W-padR)/2} y={H-8} textAnchor="middle" fontSize="7.5" fontWeight="500" fill="#6a7690" letterSpacing="0.4">
        {cfg.axes.x}
      </text>
      <text x={10} y={(padT+H-padB)/2} fontSize="7.5" fontWeight="500" fill="#6a7690" letterSpacing="0.4"
        transform={`rotate(-90 10 ${(padT+H-padB)/2})`} textAnchor="middle">
        {cfg.axes.y}
      </text>

      {/* axis end-ticks — small dots at corners */}
      <circle cx={padL} cy={H-padB} r="1" fill="#8894ad"/>
      <circle cx={W-padR} cy={H-padB} r="1" fill="#8894ad"/>
      <circle cx={padL} cy={padT} r="1" fill="#8894ad"/>
    </svg>
  );
}

// Monochrome blue heatmap — darker = better; low scores are pale with dark text
function cellBlue(v) {
  // Vibrant Apple-blue ramp. v in [0.35, 0.92] → light icy blue → saturated royal blue.
  const stops = [
    [0.35, [235, 244, 255]], // very light icy blue
    [0.50, [198, 220, 250]],
    [0.65, [130, 177, 248]],
    [0.78, [48, 125, 235]],  // vibrant Apple-blue
    [0.92, [10, 76, 200]],   // saturated royal blue
  ];
  let [lo, hi] = [stops[0], stops[stops.length-1]];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v >= stops[i][0] && v <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
  }
  const t = (v - lo[0]) / (hi[0] - lo[0] || 1);
  const c = lo[1].map((x, i) => Math.round(x + (hi[1][i] - x) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function cellTextBlue(v) {
  return v >= 0.72 ? "#ffffff" : "#0a1f42";
}
function cellSubTextBlue(v) {
  return v >= 0.72 ? "rgba(255,255,255,0.85)" : "rgba(10,31,66,0.62)";
}

function LatentVariable() {
  const cx = 50, cy = 50, rCenter = 14;
  return (
    <div className="lv-wrap">
      <svg className="lv-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <radialGradient id="lvGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="#1a7aff" stopOpacity="0.1"/>
            <stop offset="100%" stopColor="#1a7aff" stopOpacity="0"/>
          </radialGradient>
        </defs>
        <circle cx={cx} cy={cy} r="44" fill="url(#lvGlow)"/>
        {/* Subtle guide ring at mid-radius, no dashes */}
        <circle cx={cx} cy={cy} r="32" fill="none"
                stroke="rgba(26,122,255,0.14)" strokeWidth="0.12"/>
        {LV_NODES.map(n => {
          const dx = n.x - cx, dy = n.y - cy;
          const d = Math.hypot(dx, dy);
          const ux = dx / d, uy = dy / d;
          const x1 = cx + ux * rCenter;
          const y1 = cy + uy * rCenter;
          const x2 = n.x - ux * 9;
          const y2 = n.y - uy * 9;
          return (
            <line key={n.id}
                  x1={x1} y1={y1} x2={x2} y2={y2}
                  stroke={n.failing ? "#1a7aff" : "#7aa9e8"}
                  strokeOpacity={n.failing ? 0.85 : 0.45}
                  strokeWidth={(0.3 + n.weight * 0.7).toFixed(2)}
                  strokeLinecap="round"/>
          );
        })}
        {/* particles flowing inward on failing edges */}
        {LV_NODES.filter(n => n.failing).map((n, i) => (
          <circle key={"p"+n.id} cx={n.x} cy={n.y} r="0.55" fill="#1a7aff">
            <animateMotion dur={(2.2 + i * 0.35) + "s"} repeatCount="indefinite"
              path={`M0,0 L${cx - n.x},${cy - n.y}`}/>
            <animate attributeName="opacity" values="0;0.9;0" dur={(2.2 + i * 0.35) + "s"} repeatCount="indefinite"/>
          </circle>
        ))}
      </svg>
      <div className="lv-center">
        <div className="lc-ring">
          <div className="lc-kick">Latent var</div>
          <div className="lc-name">Temporal ambiguity</div>
          <div className="lc-score">explains <b>71%</b></div>
        </div>
      </div>
      {LV_NODES.map(n => (
        <div key={n.id}
             className={"lv-node" + (n.failing ? " failing" : "")}
             style={{ left: n.x + "%", top: n.y + "%" }}>
          <div className="n-kick">{n.kind}</div>
          <div className="n-name">{n.name}</div>
          <div className="n-stat">
            <span className="v">{n.stat}</span>
            <span className="n">{n.stat_n}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

function CounterfactualStrip() {
  const [openId, setOpenId] = React.useState(null);
  const [active, setActive] = React.useState(0);
  const [running, setRunning] = React.useState({});
  const [viewMode, setViewMode] = React.useState("stack"); // "stack" | "trio"
  const total = CV_CARDS.length;
  const next = () => { setOpenId(null); setActive(a => (a + 1) % total); };
  const prev = () => { setOpenId(null); setActive(a => (a - 1 + total) % total); };
  const jump = (i) => { setOpenId(null); setActive(i); };

  // aggregate lift across all queued
  const aggLift = CV_CARDS.reduce((s, c) => s + parseFloat(c.lift), 0).toFixed(2);
  const totalMin = CV_CARDS.reduce((s, c) => {
    const m = c.cost.match(/~(\d+)m/); return s + (m ? +m[1] : 0);
  }, 0);

  return (
    <div className="cv-strip">
      <div className="cv-head">
        <div className="cv-head-titlecol">
          <div className="cv-head-kick">
            <span className="cv-subset">SUBSET OF</span>
            <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2 L8 6 L4 10" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            <span className="cv-parent">Downstream Reality</span>
          </div>
          <div className="cv-head-t">Queued experiments</div>
          <div className="cv-head-line">
            Ranked by expected lift. Compiled decomposition-edits, each targeting a specific cold cell or novel chain.
          </div>
        </div>
        <div className="cv-head-meta">
          <div className="cv-viewtoggle" role="tablist" aria-label="View mode">
            <button
              className={"cv-vt-btn" + (viewMode === "stack" ? " active" : "")}
              onClick={() => { setOpenId(null); setViewMode("stack"); }}
              aria-pressed={viewMode === "stack"}
              title="Focused stack"
            >
              <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true">
                <rect x="3" y="3" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" strokeWidth="1.4"/>
                <rect x="5" y="1" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" strokeWidth="1.4" opacity="0.5"/>
              </svg>
              <span>Stack</span>
            </button>
            <button
              className={"cv-vt-btn" + (viewMode === "trio" ? " active" : "")}
              onClick={() => { setOpenId(null); setViewMode("trio"); }}
              aria-pressed={viewMode === "trio"}
              title="Three at a time"
            >
              <svg width="14" height="10" viewBox="0 0 18 10" aria-hidden="true">
                <rect x="1" y="1" width="4.5" height="8" rx="1" fill="none" stroke="currentColor" strokeWidth="1.4"/>
                <rect x="7" y="1" width="4.5" height="8" rx="1" fill="none" stroke="currentColor" strokeWidth="1.4"/>
                <rect x="13" y="1" width="4.5" height="8" rx="1" fill="none" stroke="currentColor" strokeWidth="1.4"/>
              </svg>
              <span>Trio</span>
            </button>
          </div>
          <div className="cv-meta-cell"><b>{total}</b><span>queued</span></div>
          <div className="cv-meta-cell hi"><b>+{aggLift}</b><span>aggregate lift</span></div>
          <div className="cv-meta-cell"><b>~{totalMin}m</b><span>eval time</span></div>
        </div>
      </div>

      {/* Carousel stage */}
      <div className="cv-stage">
        <button className="cv-nav cv-nav-l" onClick={prev} aria-label="Previous experiment">
          <svg width="14" height="14" viewBox="0 0 12 12"><path d="M8 2 L4 6 L8 10" stroke="currentColor" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>

        <div className={"cv-fan cv-fan-" + viewMode + (openId ? " open" : "")}>
          {CV_CARDS.map((c, i) => {
            const isOpen = openId === c.id;
            const isActive = i === active && !openId;
            const offset = ((i - active) % total + total) % total;
            // show 3: active (0), next (1), next-next (2)
            const posIdx = offset > total / 2 ? offset - total : offset;
            const rank = i + 1;
            const isRun = !!running[c.id];
            return (
              <div
                key={c.id}
                className={"cv-card" + (isOpen ? " open" : "") + (isActive ? " active" : "")}
                style={isOpen ? {} : {
                  '--pos': posIdx,
                  '--abs': Math.abs(posIdx),
                  zIndex: 100 - Math.abs(posIdx),
                }}
                onClick={() => { if (!isOpen && !isActive) jump(i); }}
              >
                <div className="cv-card-top">
                  <div className="cv-card-rank">#{rank}</div>
                  <div className="cv-card-kick">
                    <span className="k-l">{c.kick}</span>
                    <span className="k-lift">{c.lift}</span>
                  </div>
                  <div className="cv-card-name">{c.name}</div>
                  <div className="cv-card-sub">{c.sub}</div>
                  <div className="cv-card-meta">
                    <div className="changes">
                      {c.changes.map(ch => <span key={ch} className="chg">{ch}</span>)}
                    </div>
                    <div className="cost">{c.cost}</div>
                  </div>
                  <div className="cv-card-expand">
                    <span className="cv-source-pill">
                      <span className="sp-l">FROM</span>
                      {c.sourceChains.map(s => (
                        <span key={s.id} className="sp-chain">{s.id}</span>
                      ))}
                    </span>
                    <div className="cv-actions">
                      <button
                        className={"cv-decomp-btn" + (isOpen ? " active" : "")}
                        onClick={(e) => { e.stopPropagation(); setOpenId(isOpen ? null : c.id); }}
                      >
                        {isOpen ? "Hide" : "Inspect"}
                        <svg width="9" height="9" viewBox="0 0 12 12"><path d={isOpen ? "M2 7.5 L6 3.5 L10 7.5" : "M2 4.5 L6 8.5 L10 4.5"} stroke="currentColor" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </button>
                      <button
                        className={"cv-run-btn" + (isRun ? " running" : "")}
                        onClick={(e) => { e.stopPropagation(); setRunning(r => ({...r, [c.id]: true})); }}
                      >
                        {isRun ? (
                          <>
                            <span className="cv-run-dot"/>Running
                          </>
                        ) : (
                          <>
                            <svg width="9" height="10" viewBox="0 0 10 12" aria-hidden="true"><path d="M2 1.5 L2 10.5 L9 6 Z" fill="currentColor"/></svg>
                            Run experiment
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </div>
                {isOpen && (
                  <div className="cv-card-body">
                    <div className="cv-body-section">
                      <div className="cv-body-label">Source chains</div>
                      <div className="cv-body-chains">
                        {c.sourceChains.map(s => (
                          <div key={s.id} className="cv-chain-row">
                            <span className="cv-chain-id">CHAIN · {s.id}</span>
                            <span className="cv-chain-lbl">{s.label}</span>
                            <span className="cv-chain-nov">nov {s.novelty.toFixed(2)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="cv-body-section">
                      <div className="cv-body-label">Slot-level diff</div>
                      <div className="cv-body-diff">
                        {c.decomposition.map((d, j) => (
                          <div key={j} className="cv-diff">
                            <div className="cv-diff-slot">{d.slot}</div>
                            <div className="cv-diff-cols">
                              <div className="cv-diff-col before">
                                <div className="cv-diff-h">BEFORE</div>
                                <div className="cv-diff-body">{d.before}</div>
                              </div>
                              <div className="cv-diff-arrow" aria-hidden="true">→</div>
                              <div className="cv-diff-col after">
                                <div className="cv-diff-h">AFTER</div>
                                <div className="cv-diff-body">{d.after}</div>
                              </div>
                            </div>
                            <div className="cv-diff-foot">
                              <span className="cv-diff-tokens">{d.tokens > 0 ? "+" : ""}{d.tokens} tokens</span>
                              <span className="cv-diff-why">{d.rationale}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="cv-body-section">
                      <div className="cv-body-label">Expected lift · target cells</div>
                      <div className="cv-body-cells">
                        {c.targetCells.map((t, j) => (
                        <div key={j} className="cv-cell-row">
                          <span className="cv-cell-var">{t.variant}</span>
                          <span className="cv-cell-axis">{t.axis}</span>
                          <span className="cv-cell-before">{t.before.toFixed(2)}</span>
                          <svg width="18" height="8" viewBox="0 0 18 8"><path d="M1 4 L14 4 M11 1 L16 4 L11 7" stroke="#10b981" strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          <span className="cv-cell-after">{t.after.toFixed(2)}</span>
                          <span className="cv-cell-delta">+{(t.after - t.before).toFixed(2)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        </div>

        <button className="cv-nav cv-nav-r" onClick={next} aria-label="Next experiment">
          <svg width="14" height="14" viewBox="0 0 12 12"><path d="M4 2 L8 6 L4 10" stroke="currentColor" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      <div className="cv-pag">
        {CV_CARDS.map((c, i) => (
          <button
            key={c.id}
            className={"cv-dot" + (i === active ? " active" : "")}
            onClick={() => jump(i)}
            aria-label={"Go to experiment " + (i + 1)}
          >
            <span className="cv-dot-rank">#{i + 1}</span>
            <span className="cv-dot-lift">{c.lift}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function StrategyCarousel() {
  const { idx, setIdx } = React.useContext(StrategyCtx);
  const n = STRATEGIES.length;
  const s = STRATEGIES[idx];
  const shadow = hexToRgba(s.accent, 0.45);

  const cardStyle = (i) => {
    const rel = i - idx;
    const abs = Math.abs(rel);
    const tx = rel * 290;
    const tz = abs === 0 ? 0 : -180 - (abs - 1) * 110;
    const ry = rel === 0 ? 0 : rel > 0 ? -24 : 24;
    const ty = abs === 0 ? 0 : 6 + (abs - 1) * 4;
    const opacity = abs === 0 ? 1 : abs === 1 ? 0.7 : abs === 2 ? 0.32 : 0;
    const filter = abs === 0 ? "none" : `saturate(${0.7 - abs * 0.15}) brightness(${0.94 - abs * 0.04}) blur(${abs === 1 ? 0.8 : abs * 1.6}px)`;
    const pointerEvents = abs <= 1 ? "auto" : "none";
    const zIndex = 10 - abs;
    return {
      transform: `translate3d(${tx}px, ${ty}px, ${tz}px) rotateY(${ry}deg)`,
      opacity, filter, pointerEvents, zIndex,
      ["--card-accent"]: STRATEGIES[i].accent,
      ["--card-accent-soft"]: hexToRgba(STRATEGIES[i].accent, 0.12),
      ["--card-glow"]: hexToRgba(STRATEGIES[i].accent, 0.22),
    };
  };

  const wrapVars = {
    ["--strat-accent"]: s.accent,
    ["--strat-shadow"]: shadow,
    ["--stage-glow"]: hexToRgba(s.accent, 0.08),
    ["--chip-accent"]: s.accent,
    ["--chip-shadow"]: shadow,
    ["--desc-accent"]: s.accent,
  };

  return (
    <>
      <style dangerouslySetInnerHTML={{__html: STRAT_CSS}}/>
      <div className="sc-wrap" style={wrapVars}>
        <div className="sc-arm-row">
          <div className="sc-arm">
            {STRATEGIES.map((st, i) => (
              <button key={st.id}
                      className={"sc-arm-chip" + (i === idx ? " active" : "")}
                      onClick={() => setIdx(i)}
                      style={{
                        ["--chip-accent"]: st.accent,
                        ["--chip-shadow"]: hexToRgba(st.accent, 0.4),
                        color: i === idx ? "#fff" : st.accent,
                      }}>
                <span className="rnk">#{st.rank}</span>
                <span className="dot"/>
                <span>{st.name}</span>
              </button>
            ))}
          </div>
          <div className="sc-counter-inline" aria-label={`Strategy ${idx+1} of ${n}`}>
            <span className="cur">{String(idx+1).padStart(2,"0")}</span>
            <span className="sep">/</span>
            <span className="tot">{String(n).padStart(2,"0")}</span>
            <div className="sc-counter-bar"><div className="fill" style={{width: ((idx+1)/n*100)+"%"}}/></div>
          </div>
        </div>

        <div className="sc-stage">
          <div className="sc-stage-glow"/>
          <div className="sc-stage-inner">
            {STRATEGIES.map((st, i) => (
              <div key={st.id}
                   className={"sc-card" + (i === idx ? " active" : "")}
                   style={cardStyle(i)}
                   onClick={() => i !== idx && setIdx(i)}>
                <div className="sc-card-head">
                  <div className="sc-card-id-col">
                    <div className="sc-card-short">
                      <span className="rank-pill">RANK #{st.rank}</span>
                      <span>{st.short}</span>
                    </div>
                    <div className="sc-card-name">{st.name}</div>
                  </div>
                  <div className={"sc-card-status " + st.status}>{st.status}</div>
                </div>
                <div className="sc-card-philo">"{st.philosophy}"</div>
                <div className="sc-card-impact">
                  {st.lifts.map((l, li) => (
                    <div key={li} className="sc-impact-chip">
                      <span className="v">{l.v}</span>
                      <span className={"d" + (l.d.startsWith("−") || l.d.startsWith("-") ? " neg" : "")}>{l.d}</span>
                    </div>
                  ))}
                </div>
                <div className="sc-card-meta">
                  <div className="sc-card-stat"><span className="l">Effect</span><span className="v eff">{st.effect.toFixed(2)}</span></div>
                  <div className="sc-card-stat"><span className="l">Adopt</span><span className="v">{Math.round(st.adopt*100)}%</span></div>
                  <div className="sc-card-stat"><span className="l">Runs</span><span className="v">{st.runs}</span></div>
                </div>
              </div>
            ))}
          </div>
          <button className="sc-nav prev"
                  onClick={() => setIdx((idx - 1 + n) % n)}
                  aria-label="Previous strategy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button className="sc-nav next"
                  onClick={() => setIdx((idx + 1) % n)}
                  aria-label="Next strategy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branch card — restrained</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 44px;
    background: #F7F8FA;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    color: #0B0B0C;
  }
  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { color: #64748B; font-size: 14px; margin: 0 0 28px; }
  .stack { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }

  /* clean white card — hairline + soft shadow, no heavy glass, no rainbow */
  .card {
    position: relative; overflow: hidden; border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(15,23,42,0.06), 0 1px 2px rgba(11,18,40,0.04), 0 18px 40px -24px rgba(11,18,40,0.22);
  }
  .pad { padding: 16px 20px 14px; }
  .sbadge { font-size: 11px; font-weight: 600; color: #94A3B8; letter-spacing: .04em; margin-bottom: 10px; }
  .title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .tag { margin-top: 3px; font-size: 11.5px; color: #64748B; }
  .col-h { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: #94A3B8; }

  /* neutral feed chip — ink, hairline, NO accent fill */
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; border-radius:999px;
    font-size:11.5px; font-weight:500; color:#0B0B0C; white-space:nowrap;
    background:#fff; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.10); }
  .chip .mk { width:5px; height:5px; border-radius:1.5px; background:#0B0B0C; flex:none; }

  .diagram { position: relative; }
  .diagram svg { position: absolute; inset: 0; }
  .onode { position: absolute; display:flex; align-items:center; gap:9px; transform: translateY(-50%); }
  .omk { width:7px; height:7px; border-radius:2px; background:#0B0B0C; flex:none; }
  .olabel { font-size:12.5px; font-weight:500; color:#1A1F2B; white-space:nowrap; }
  .inode { position:absolute; display:flex; align-items:center; gap:8px; transform: translateY(-50%); }
  .imk { width:6px; height:6px; border-radius:2px; background:#0B0B0C; flex:none; }
  .ilabel { font-size:12px; font-weight:500; color:#334155; white-space:nowrap; }

  .foot { margin-top: 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-top: 1px solid rgba(15,23,42,0.07); padding-top: 12px; }
  .team { display:flex; align-items:center; gap:6px; }
  .logo { width:18px; height:18px; border-radius:5px; background:#14181f; display:flex; align-items:center; justify-content:center; }
  .logo svg { width:11px; height:11px; }
  .teamname { font-size:11px; font-weight:600; letter-spacing:-.01em; color:#334155; }
  .use { font-size:10.5px; font-weight:600; color:#0B0B0C; }
</style>
</head>
<body>
  <h1>Branch card — restrained</h1>
  <p class="sub">Near-black ink on white, like the hero. Accent appears once — the idea hub. No rainbow, no all-over color.</p>
  <div class="stack" id="stack"></div>

  <script>
    const ACCENT = "#5856d6";
    const INK = "#0B0B0C";
    const TPL = {
      name: "Research Project",
      tag: "Map your hypothesis, evidence, and next experiments",
      ins: ["Papers", "PDFs", "Datasets", "Notes", "Links"],
      outs: ["Hypothesis Map", "Evidence Matrix", "Experiment Plan", "Research Brief"],
    };
    // idea hub = the single accent element
    const hub = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="${ACCENT}" fill-opacity="0.12"/><circle cx="${x}" cy="${y}" r="4.5" fill="${ACCENT}"/>`;
    const chip = (l) => `<span class="chip"><span class="mk"></span>${l}</span>`;
    const foot = () => `<div class="foot"><div class="team"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 4 L19 20 M19 4 L5 20"/></svg></span><span class="teamname">Intersice Team</span><svg style="width:13px;height:13px" viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="#0B0B0C"/><path d="M3.5 6.2 L5.1 7.8 L8.5 4.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="use">Use template &rarr;</span></div>`;

    // V1 · compact: neutral feed chips on top, ink branches to deliverables
    function v1() {
      const feed = TPL.ins.map(chip).join("");
      const W = 290, rootX = 30, nodeX = 142, N = TPL.outs.length, H = 210;
      const oy = TPL.outs.map((_, i) => 24 + i * (H - 48) / (N - 1));
      const paths = oy.map((y) => `<path d="M ${rootX} ${H/2} C ${rootX+50} ${H/2}, ${nodeX-54} ${y}, ${nodeX-12} ${y}" fill="none" stroke="${INK}" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round"/>`).join("");
      const nodes = TPL.outs.map((l, i) => `<div class="onode" style="left:${nodeX-12}px; top:${oy[i]}px;"><span class="omk"></span><span class="olabel">${l}</span></div>`).join("");
      return `<div class="card" style="width:328px;"><div class="pad">
        <div class="sbadge">V1 · compact</div>
        <div class="title">${TPL.name}</div><div class="tag">${TPL.tag}</div>
        <div class="col-h" style="margin-top:13px;">Feed in</div>
        <div style="margin-top:7px; display:flex; flex-wrap:wrap; gap:6px;">${feed}</div>
        <div class="col-h" style="margin-top:14px;">Branches into</div>
        <div class="diagram" style="margin-top:4px; width:${W}px; height:${H}px;"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}${hub(rootX, H/2)}</svg>${nodes}</div>
        ${foot()}</div></div>`;
    }

    // V2 · full flow: ink inputs (left) → accent idea → ink outputs (right)
    function v2() {
      const W = 500, hubX = 232, H = 244, M = TPL.ins.length, N = TPL.outs.length;
      const iy = TPL.ins.map((_, i) => 28 + i * (H - 56) / (M - 1));
      const oy = TPL.outs.map((_, i) => 40 + i * (H - 80) / (N - 1));
      const inL = iy.map((y) => `<path d="M 92 ${y} C 150 ${y}, 185 ${H/2}, ${hubX-10} ${H/2}" fill="none" stroke="${INK}" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>`).join("");
      const outL = oy.map((y) => `<path d="M ${hubX+10} ${H/2} C ${hubX+56} ${H/2}, 290 ${y}, 320 ${y}" fill="none" stroke="${INK}" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round"/>`).join("");
      const inN = TPL.ins.map((l, i) => `<div class="inode" style="left:0; top:${iy[i]}px;"><span class="imk"></span><span class="ilabel">${l}</span></div>`).join("");
      const outN = TPL.outs.map((l, i) => `<div class="onode" style="left:320px; top:${oy[i]}px;"><span class="omk"></span><span class="olabel">${l}</span></div>`).join("");
      return `<div class="card" style="width:540px;"><div class="pad">
        <div class="sbadge">V2 · full flow &nbsp;·&nbsp; feed in → idea → generates</div>
        <div class="title">${TPL.name}</div><div class="tag">${TPL.tag}</div>
        <div style="display:flex; justify-content:space-between; margin-top:10px;"><span class="col-h">Feed in</span><span class="col-h" style="margin-right:40px;">Generates</span></div>
        <div class="diagram" style="margin-top:4px; width:${W}px; height:${H}px;"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${inL}${outL}${hub(hubX, H/2)}</svg>${inN}${outN}</div>
        ${foot()}</div></div>`;
    }

    document.getElementById("stack").innerHTML = v2() + v1();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InterAxis Tab Sync</title>
    <style>
      :root {
        --ink: #0f172a;
        --slate: #334155;
        --muted: #64748b;
        --line: rgba(15, 23, 42, 0.1);
        --accent: rgba(15, 23, 42, 0.92);
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter,
          system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .brand .mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--ink);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
      }
      .brand h1 { font-size: 14px; margin: 0; font-weight: 650; }
      label.field {
        display: block;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 0 4px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        font-size: 12.5px;
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: none;
        color: var(--ink);
      }
      input[type="text"]:focus { border-color: rgba(15, 23, 42, 0.28); }

      /* ── Window chooser ── */
      .windows {
        max-height: 188px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 4px;
      }
      .win {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 8px;
        border-radius: 7px;
        cursor: pointer;
      }
      .win:hover { background: rgba(15, 23, 42, 0.04); }
      .win input[type="checkbox"] { width: 15px; height: 15px; margin: 0; flex: none; }
      .win .meta { min-width: 0; }
      .win .title {
        font-size: 12.5px;
        font-weight: 550;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .win .count { font-size: 11px; color: var(--muted); }
      .empty { font-size: 12px; color: var(--muted); padding: 8px; }

      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 650;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      button:active { transform: scale(0.99); }
      #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
      .hint { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">✦</span>
      <h1>InterAxis Tab Sync</h1>
    </div>

    <label class="field" for="baseUrl">App URL</label>
    <input id="baseUrl" type="text" placeholder="http://localhost:3000" />

    <label class="field" for="token">Pairing token</label>
    <input id="token" type="text" placeholder="Paste from /app/connect/tabs" />

    <label class="field">Windows to sync</label>
    <div id="windows" class="windows">
      <div class="empty">Loading windows…</div>
    </div>

    <button id="sync">Sync selected windows</button>
    <div id="status"></div>
    <p class="hint">
      Get your token at <strong>/app/connect/tabs</strong>. Only the windows you
      check are synced; their tabs surface in the objective chatbox.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
